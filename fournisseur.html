<script>
"use strict";
/* 11Barré Entreprises — maquette du portail fournisseur et entreprise (dossier fonctionnel §5.2).
   Données locales de démonstration, partagées avec l'espace chauffeur : une livraison créée ici arrive chez les livreurs en ligne,
   ses statuts reviennent ici, et l'argent passe par le journal immuable de moteur.js. Aucun serveur. */
const PLAN=LS.get("plan",null)||M.PLAN_DEFAUT;
const SL={draft:["Brouillon","n"],quoted:["Devis","n"],awaiting_payment:["Attente de paiement","w"],ready_for_assignment:["Recherche d'un livreur","w"],assigned:["Livreur affecté","b"],courier_to_pickup:["En route vers la collecte","b"],picked_up:["Colis récupéré","b"],in_transit:["En transit","b"],arrived:["Arrivé","b"],delivered:["Livré","g"],cancelled:["Annulé","r"],failed_delivery:["Échec de livraison","r"],return_required:["Retour à faire","w"],returned:["Retourné","n"]};
const CATN={lm:"Livraison à moto",ex:"Express Cargo",ca:"Camion"},TYPEORG={fournisseur:"Fournisseur / marchand",entreprise:"Entreprise cliente"};
const ROLES={admin:{creer:1,annuler:1,importer:1,finance:1,gerer:1,nom:"Administrateur"},operateur:{creer:1,annuler:1,importer:1,nom:"Opérateur"},lecture:{finance:1,nom:"Lecture seule"}};
const VIT={exp:"Express",std:"Standard",grp:"Un peu plus long",diff:"Dans 2 heures"},OPS={wave:"Wave",orange:"Orange Money",mtn:"MTN MoMo",virement:"Virement bancaire"};
const DESTS=LIEUX.filter(l=>l.n!=="Ma position (démo)");
const P={org:ORGS.get(LS.get("org_id",null)),user:LS.get("p_user",null),tab:"tableau",sel:null,sheet:null,reg:{type:"fournisseur",nom:"",rccm:"",tel:"",email:"",adresse:"",contact:"",place:"Plateau"},f:null,imp:{texte:"",lignes:null,rapport:null},filtre:"",q:"",moisFac:"",vers:{m:"",op:"wave",c:""},pt:{nom:"",place:"Plateau",adresse:"",tel:"",horaires:""},mb:{nom:"",role:"operateur"}};
const nouveauForm=()=>({refExt:"",point:"",dNom:"",dTel:"",dest:"Cocody Angré",dAdr:"",colis:"",poids:"1",volume:"",vit:"std",porte:false,cod:"",payeur:"compte"});P.f=nouveauForm();
const ledger=()=>M.chargerLivre(LS.get("ledger",null)),sauveL=L=>LS.set("ledger",{tx:L.tx});
const user=()=>P.org?(P.org.membres.find(m=>m.id===P.user)||P.org.membres[0]):null,peut=a=>{const u=user();return !!(u&&ROLES[u.role]&&ROLES[u.role][a])&&P.org.statut==="valide"};
const mes=()=>P.org?LIV.lire().filter(o=>o.org===P.org.id).sort((a,b)=>b.cree_le-a.cree_le):[];
/* le portail ne réécrit que ce qui lui appartient (points, utilisateurs) : statut et remise restent à l'administration */
const saveOrg=()=>{if(!P.org)return;LS.set("org_id",P.org.id);if(ORGS.get(P.org.id))ORGS.maj(P.org.id,o=>{o.points=P.org.points;o.membres=P.org.membres});else ORGS.ajouter(P.org)},toast=m=>{document.querySelectorAll("#toast").forEach(x=>x.remove());const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
const dt=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—",mois=t=>new Date(t).toISOString().slice(0,7);
const chip=s=>{const l=SL[s]||[s,"n"];return`<span class="chip ${l[1]}">${esc(l[0])}</span>`};
const code4=()=>String(1000+Math.floor(Math.random()*9000)),cpt=(k)=>{const n=LS.get(k,0)+1;LS.set(k,n);return n};
const defPoint=()=>P.org&&(P.org.points.find(p=>p.defaut)||P.org.points[0]);
/* ---------- Devis ---------- */
function calcul(f){const pt=P.org.points.find(p=>p.id===f.point)||defPoint(),d=lieu(f.dest);if(!pt)return{err:"Ajoutez d'abord un point de collecte (Paramètres)."};if(!d)return{err:"Choisissez la destination."};
 const o=lieu(pt.place),dk=Math.max(.8,km(o,d)*1.35),ch=M.choisirCategorie(PLAN,{poids_kg:+f.poids||0,volume_m3:+f.volume||0});
 const devis=M.devis(PLAN,{cat:ch.cat,km:dk,vitesse:f.vit,porte:f.porte,remise:P.org.remise||0}),du=Math.max(4,Math.round(dk/(ch.mode==="moto"?30:20)*60)+3);return{pt,o,d,km:+dk.toFixed(1),ch,devis,du}}
const devisHtml=c=>c.err?`<p class="ko">${esc(c.err)}</p>`:`<div class="hl"><span>Mode</span><b>${c.ch.mode==="moto"?"Moto":"Cargo"} · ${esc(CATN[c.ch.cat])}</b></div><p class="nt" style="margin:2px 0 8px">${esc(c.ch.raison)}</p><div class="hl"><span>Trajet</span><b>${c.km} km · ≈ ${c.du} min</b></div>${c.devis.lignes.map(l=>`<div class="hl"><span>${esc(l.libelle)}</span><b>${l.montant<0?"− ":""}${F(Math.abs(l.montant))}</b></div>`).join("")}<div class="hl" style="font-size:18px"><b>Total transport</b><b>${F(c.devis.total)}</b></div><p class="nt">Prix valable ${PLAN.validite_devis_min} min${PLAN.demonstration?" · grille de démonstration":""}. ${P.f.payeur==="compte"?"Facturé à votre compte en fin de période.":"Payé par le destinataire à la livraison."}</p>`;
function creer(f,refExt){const u=user();if(!peut("creer"))return{err:"Votre rôle ne permet pas de créer des livraisons."};
 const n=(f.dNom||"").trim(),tel=String(f.dTel||"").replace(/\D/g,"");if(n.length<2)return{err:"Nom du destinataire obligatoire"};if(tel.length<8)return{err:"Téléphone du destinataire invalide"};
 const cod=f.cod===""||f.cod==null?0:Number(f.cod);if(!Number.isInteger(cod)||cod<0)return{err:"Montant à encaisser invalide"};if(!(f.vit in PLAN.vitesses))return{err:"Vitesse inconnue"};
 if(refExt&&mes().some(o=>o.refExt===refExt&&o.statut!=="cancelled"))return{err:"Référence déjà utilisée : "+refExt,doublon:true};
 const c=calcul(f);if(c.err)return{err:c.err};
 const o={id:"o"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),ref:"11B-"+new Date().getFullYear()+"-"+String(cpt("compteur")).padStart(5,"0"),refExt:refExt||"",org:P.org.id,orgNom:P.org.nom,cree_par:u.nom,cree_le:Date.now(),
  mode:c.ch.mode,cat:c.ch.cat,catNom:CATN[c.ch.cat],de:{n:c.pt.nom,z:c.o.z,la:c.o.la,lo:c.o.lo,adresse:c.pt.adresse,tel:c.pt.tel},a:{n:c.d.n,z:c.d.z,la:c.d.la,lo:c.d.lo,adresse:f.dAdr||""},dest:{nom:n,tel:f.dTel},colis:{c:f.colis||"Colis",poids:+f.poids||0,volume:+f.volume||0},
  vitesse:f.vit,vitesseNom:VIT[f.vit],porte:!!f.porte,cod,payeurTransport:f.payeur,devis:c.devis,km:c.km,du:c.du,codeCollecte:code4(),codeLivraison:code4(),statut:"draft",evenements:[],chauffeur:null};
 M.changerStatut(o,"quoted",u.nom,"Devis accepté");M.changerStatut(o,"ready_for_assignment",u.nom,"Commande confirmée (compte professionnel)");
 const l=LIV.lire();l.push(o);LIV.ecrire(l);return{o}}
/* ---------- Import CSV ---------- */
const COLS=["reference","destinataire","telephone","destination","adresse","contenu","poids_kg","cod","paiement_transport","vitesse"];
const EXEMPLE="reference;destinataire;telephone;destination;adresse;contenu;poids_kg;cod;paiement_transport;vitesse\nCMD-001;Awa Koné;0707070707;Marcory Zone 4;Rue 12, près de la pharmacie;Robe;1.2;15000;compte;std\nCMD-002;Yao Marc;0505050505;Yopougon Siporex;Carrefour Siporex;Sac de riz;28;0;compte;std\nCMD-003;Aya;12;Cocody Angré;;Chaussures;1;8000;destinataire;exp\nCMD-004;Koffi Paul;0101010101;Lieu inconnu;;Documents;0.1;0;compte;std\nCMD-001;Awa Koné;0707070707;Marcory Zone 4;;Robe;1.2;15000;compte;std";
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9_]+/g,"_").replace(/^_|_$/g,"");
function parseCSV(txt){const sep=(txt.split(/\r?\n/)[0]||"").includes(";")?";":",",rows=[];let row=[],cur="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(c=>c.trim()!==""))rows.push(row);row=[]}else cur+=ch}row.push(cur);if(row.some(c=>c.trim()!==""))rows.push(row);return rows}
function analyser(txt){const rows=parseCSV(txt);if(rows.length<2)return{err:"Le fichier doit contenir un en-tête et au moins une ligne."};
 const h=rows[0].map(norm),manque=["destinataire","telephone","destination"].filter(c=>!h.includes(c));if(manque.length)return{err:"Colonnes obligatoires absentes : "+manque.join(", ")};
 const vus=new Set(),lignes=rows.slice(1).map((r,i)=>{const g=c=>(r[h.indexOf(c)]||"").trim(),e=[],ref=g("reference");
  const d=DESTS.find(x=>norm(x.n)===norm(g("destination")));if(!d)e.push("destination inconnue « "+g("destination")+" »");
  if(g("destinataire").length<2)e.push("destinataire manquant");if(g("telephone").replace(/\D/g,"").length<8)e.push("téléphone invalide");
  const poids=g("poids_kg")===""?1:Number(g("poids_kg").replace(",","."));if(!isFinite(poids)||poids<0)e.push("poids invalide");
  const cod=g("cod")===""?0:Number(g("cod"));if(!Number.isInteger(cod)||cod<0)e.push("montant à encaisser invalide");
  const pay=norm(g("paiement_transport"))||"compte";if(!["compte","destinataire"].includes(pay))e.push("paiement_transport : compte ou destinataire");
  const vit=g("vitesse")||"std";if(!(vit in PLAN.vitesses))e.push("vitesse inconnue « "+vit+" »");
  let doublon=false;if(ref){if(vus.has(ref)||mes().some(o=>o.refExt===ref&&o.statut!=="cancelled")){doublon=true;e.push("doublon de la référence "+ref)}vus.add(ref)}
  const f=Object.assign(nouveauForm(),{refExt:ref,dNom:g("destinataire"),dTel:g("telephone"),dest:d?d.n:"",dAdr:g("adresse"),colis:g("contenu"),poids:String(isFinite(poids)?poids:1),vit:vit in PLAN.vitesses?vit:"std",cod:String(cod),payeur:pay==="compte"?"compte":"dest"});
  let prix=null;if(!e.length){const c=calcul(f);if(c.err)e.push(c.err);else prix=c.devis.total}return{n:i+2,f,ref,erreurs:e,prix,doublon}});return{lignes}}
/* ---------- Rendu ---------- */
const field=(l,k,v,ex)=>`<label class="l">${l}<input class="fld" data-r="${k}" value="${esc(v)}" ${ex||""}></label>`;
function inscriptionV(){const r=P.reg;return`<main><h1>Ouvrir un compte entreprise</h1><p class="nt">Fournisseurs, marchands et entreprises : créez, importez et suivez vos livraisons. Le compte est vérifié par 11Barré avant activation.</p><div class="card"><div class="grid"><label class="l">Type de compte<select class="fld" data-r="type">${Object.entries(TYPEORG).map(([k,v])=>`<option value="${k}" ${r.type===k?"selected":""}>${v}</option>`).join("")}</select></label>${field("Raison sociale","nom",r.nom,'maxlength="80"')}${field("RCCM (si disponible)","rccm",r.rccm,'maxlength="40"')}${field("Personne à contacter","contact",r.contact,'maxlength="60"')}${field("Téléphone","tel",r.tel,'inputmode="tel" maxlength="20"')}${field("E-mail","email",r.email,'type="email" maxlength="80"')}${field("Adresse de facturation","adresse",r.adresse,'maxlength="120"')}<label class="l">Premier point de collecte<select class="fld" data-r="place">${DESTS.map(d=>`<option ${r.place===d.n?"selected":""}>${esc(d.n)}</option>`).join("")}</select></label></div><p class="nt">En continuant, vous acceptez les conditions d'utilisation et la notice de confidentialité (textes à fournir avant mise en service).</p><button class="btn" data-a="creerorg">Créer le compte</button></div></main>`}
function attenteV(){const s=P.org.statut,msg={en_verification:"11Barré contrôle votre dossier et vous prévient du résultat. Un compte non validé ne peut pas créer de livraisons.",complement:"11Barré demande un complément d'information : "+(P.org.motif||""),refuse:"Votre demande a été refusée : "+(P.org.motif||""),suspendu:"Votre compte est suspendu : "+(P.org.motif||"")+". Contactez 11Barré."}[s]||"";
 return`<main><h1>${s==="en_verification"?"Dossier en cours de vérification":"Compte non actif"}</h1><div class="card"><p><b>${esc(P.org.nom)}</b> · ${esc(TYPEORG[P.org.type])}</p><p>${esc(msg)}</p>${s==="complement"?'<button class="btn" data-a="renvoyer">Renvoyer le dossier</button> ':""}<button class="btn s" data-a="resetorg">Créer un autre compte</button> <a href="admin.html" style="color:inherit">Administration 11Barré</a></div></main>`}
function dashV(){const L=mes(),auj=L.filter(o=>mois(o.cree_le)===mois(Date.now())&&new Date(o.cree_le).toDateString()===new Date().toDateString()),cours=L.filter(o=>["ready_for_assignment","assigned","courier_to_pickup","picked_up","in_transit","arrived"].includes(o.statut)),liv=L.filter(o=>o.statut==="delivered"),fin=L.filter(o=>["delivered","failed_delivery","cancelled"].includes(o.statut)),m=liv.filter(o=>mois(o.cree_le)===mois(Date.now())),LG=ledger(),du=M.solde(LG,"dette_fournisseur:"+P.org.id).net,cr=M.creance(LG,P.org.id);
 return`<h1>Tableau de bord</h1><div class="kpi"><div><b>${auj.length}</b><span>commandes aujourd'hui</span></div><div><b>${cours.length}</b><span>en cours</span></div><div><b>${liv.length}</b><span>livrées</span></div><div><b>${fin.length?Math.round(liv.length/fin.length*100)+" %":"—"}</b><span>taux de livraison réussie</span></div><div><b>${F(m.reduce((s,o)=>s+o.devis.total,0))}</b><span>dépenses transport du mois</span></div>${peut("finance")?`<div><b>${F(du)}</b><span>fonds à vous reverser (paiements à la livraison)</span></div><div><b>${F(cr)}</b><span>à payer à 11Barré (factures)</span></div>`:""}</div>${P.org.remise?`<div class="eb">Contrat : tarif négocié <b>−${Math.round(P.org.remise*100)} %</b> sur le transport (remise de démonstration).</div>`:""}<h2>Dernières livraisons</h2>${tableL(L.slice(0,6))}`}

const A={
 creerorg(){const r=P.reg,e=[];if(r.nom.trim().length<2)e.push("raison sociale");if(r.tel.replace(/\D/g,"").length<8)e.push("téléphone");if(!/^\S+@\S+\.\S+$/.test(r.email))e.push("e-mail");if(r.adresse.trim().length<3)e.push("adresse de facturation");if(e.length)return toast("À compléter : "+e.join(", "));
  P.org={id:"S"+Date.now().toString(36),nom:r.nom.trim(),type:r.type,rccm:r.rccm.trim(),tel:r.tel.trim(),email:r.email.trim(),adresse:r.adresse.trim(),statut:"en_verification",remise:0,cree_le:Date.now(),points:[{id:"p1",nom:"Point principal",place:r.place,adresse:r.adresse.trim(),tel:r.tel.trim(),horaires:"",defaut:true}],membres:[{id:"u1",nom:r.contact.trim()||r.nom.trim(),role:"admin"}]};P.user="u1";LS.set("p_user","u1");saveOrg();render()},
 renvoyer(){ORGS.maj(P.org.id,o=>{o.statut="en_verification"});P.org=ORGS.get(P.org.id);render();toast("Dossier renvoyé")},
 resetorg(){P.org=null;LS.set("org_id",null);render()},
 tab(t){P.tab=t.dataset.t;render()},detail(t){P.sel=t.dataset.id;P.sheet={t:"detail"};render()},fermer(){P.sheet=null;render()},fermerov(t,e){if(e.target!==t)return;P.sheet=null;render()},
 creerliv(){const r=creer(P.f,P.f.refExt.trim());if(r.err)return toast(r.err);toast("Livraison "+r.o.ref+" créée : recherche d'un livreur");P.f=nouveauForm();P.tab="livraisons";P.sel=r.o.id;P.sheet={t:"detail"};render()},
 annulerliv(t){if(!peut("annuler"))return;const o=LIV.maj(t.dataset.id,x=>{try{M.changerStatut(x,"cancelled",user().nom,"Annulée par le demandeur")}catch(e){toast(e.message)}});render();if(o)toast("Livraison annulée")},
 exemple(){P.imp.texte=EXEMPLE;P.imp.lignes=null;P.imp.rapport=null;render()},
 modele(){const u=URL.createObjectURL(new Blob([COLS.join(";")+"\n"],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="modele-import-11barre.csv";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)},
 analyser(){P.imp.rapport=null;P.imp.lignes=analyser(P.imp.texte);render()},
 importer(){const L=(P.imp.lignes&&P.imp.lignes.lignes)||[];let ok=0;const ko=[["ligne","reference","erreurs"]];
  L.forEach(l=>{if(l.erreurs.length){ko.push([l.n,l.ref,l.erreurs.join(" | ")]);return}const r=creer(l.f,l.ref);if(r.err)ko.push([l.n,l.ref,r.err]);else ok++});
  const csv=ko.length>1?"data:text/csv;charset=utf-8,"+encodeURIComponent(ko.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n")):"";
  P.imp={texte:"",lignes:null,rapport:{ok,ko:ko.length-1,csv}};render();toast(ok+" livraison(s) créée(s)")},
 demandervers(){const m=Math.round(+P.vers.m||0),LG=ledger(),rel=M.releveFournisseur(LG,P.org.id),att=LS.get("reversements",[]).filter(r=>r.org===P.org.id&&r.statut==="attente").reduce((s,r)=>s+r.m,0);
  if(m<=0)return toast("Indiquez le montant");if(m>rel.solde-att)return toast("Le montant dépasse ce qui vous est dû");if(P.vers.c.trim().length<4)return toast("Indiquez le numéro ou compte bénéficiaire");
  const l=LS.get("reversements",[]);l.push({id:"rv"+Date.now().toString(36),org:P.org.id,m,op:P.vers.op,c:P.vers.c.trim(),statut:"attente",approbations:[],at:Date.now()});LS.set("reversements",l);P.vers={m:"",op:P.vers.op,c:P.vers.c};render();toast("Demande envoyée")},
 imprimer(){window.print()},
 facturer(){const dispo=mes().filter(o=>o.statut==="delivered"&&o.cloture&&o.payeurTransport==="compte"&&!o.facture),mm=[...new Set(dispo.map(o=>mois(o.cree_le)))].sort().reverse(),sel=P.moisFac||mm[0],ds=dispo.filter(o=>mois(o.cree_le)===sel);if(!ds.length)return;
  try{const num="FAC-"+sel.slice(0,4)+"-"+String(cpt("compteur_fac")).padStart(4,"0"),f=M.facture({numero:num,client:P.org.id,clientNom:P.org.nom,periode:sel,lignes:ds.map(o=>({ref:o.ref,libelle:o.ref+" · "+o.a.n+" ("+o.catNom+")",montant:o.devis.total}))});
   const l=LS.get("factures",[]);l.push(JSON.parse(JSON.stringify(f)));LS.set("factures",l);ds.forEach(o=>LIV.maj(o.id,x=>{x.facture=num}));P.moisFac="";render();toast("Facture "+num+" générée")}catch(e){toast(e.message)}},
 voirfac(t){P.sheet={t:"fac",id:t.dataset.id};render()},
 ptadd(){const p=P.pt;if(p.nom.trim().length<2)return toast("Nom du point obligatoire");P.org.points.push({id:"p"+Date.now().toString(36),nom:p.nom.trim(),place:p.place,adresse:p.adresse.trim(),tel:p.tel.trim(),horaires:p.horaires.trim(),defaut:false});P.pt={nom:"",place:"Plateau",adresse:"",tel:"",horaires:""};saveOrg();render()},
 ptdef(t){P.org.points.forEach(p=>p.defaut=p.id===t.dataset.id);saveOrg();render()},
 ptdel(t){P.org.points=P.org.points.filter(p=>p.id!==t.dataset.id);if(!P.org.points.some(p=>p.defaut))P.org.points[0].defaut=true;saveOrg();render()},
 mbadd(){if(P.mb.nom.trim().length<2)return toast("Nom obligatoire");P.org.membres.push({id:"u"+Date.now().toString(36),nom:P.mb.nom.trim(),role:P.mb.role});P.mb.nom="";saveOrg();render()},
 mbdel(t){P.org.membres=P.org.membres.filter(m=>m.id!==t.dataset.id);if(!P.org.membres.some(m=>m.id===P.user)){P.user="u1";LS.set("p_user","u1")}saveOrg();render()}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const f=A[t.dataset.a];if(f)f(t,e)});
document.addEventListener("input",e=>{const d=e.target.dataset;if(!d)return;const v=e.target.type==="checkbox"?e.target.checked:e.target.value;
 if(d.r)P.reg[d.r]=v;else if(d.f){P.f[d.f]=v;const dv=$("#devis");if(dv)dv.innerHTML=devisHtml(calcul(P.f))}else if(d.imp)P.imp.texte=v;else if(d.v)P.vers[d.v]=v;else if(d.pt)P.pt[d.pt]=v;else if(d.mb)P.mb[d.mb]=v;
 else if(d.q){P.q=v;render();const q=document.querySelector("[data-q]");if(q){q.focus();q.setSelectionRange(v.length,v.length)}}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(!d)return;
 if(d.filtre){P.filtre=e.target.value;render()}else if(d.moisfac){P.moisFac=e.target.value;render()}else if(d.user){P.user=e.target.value;LS.set("p_user",P.user);render()}
 else if(d.r==="type"){render()}else if(d.fichier){const f=e.target.files[0];if(!f)return;if(f.size>2e6)return toast("Fichier trop volumineux (2 Mo max)");const r=new FileReader();r.onload=()=>{P.imp.texte=String(r.result);P.imp.lignes=null;P.imp.rapport=null;render()};r.readAsText(f)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&P.sheet){P.sheet=null;render()}});
/* Mise à jour automatique quand le livreur ou le journal changent (sans écraser une saisie en cours) */
setInterval(()=>{if(!P.org)return;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;const o=ORGS.get(P.org.id);if(o&&JSON.stringify(o)!==JSON.stringify(P.org)){P.org=o;render();return}if(P.org.statut!=="valide")return;const s=signature();if(s!==P.sig)render()},1500);
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
