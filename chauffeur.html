"use strict";
/* 11Barré Pro — maquette de l'espace chauffeur et livreur.

   (stockage local partagé) ; sinon, le bouton « Simuler une demande » en génère. Aucun serveur, aucun vrai paiement. */
const PLAN=LS.get("plan",null)||M.PLAN_DEFAUT,DELAI=M.seuil(PLAN,"delai_offre_s"); /* mêmes paramètres que l'application client ; délai de réponse à une offre = paramètre du plan */
const TYPES={chauffeur:{nom:"Chauffeur",veh:"Berline",tabs:["courses","cargo"],d:"Courses de personnes et transport de marchandises en voiture ou camionnette"},livreur:{nom:"Livreur à moto",veh:"Moto",tabs:["moto","livraison"],d:"Moto-taxi et livraison de colis"}};

const masque=t=>{const d=String(t||"").replace(/\D/g,"");return d.length>=8?d.slice(0,2)+" •• •• •• "+d.slice(-2):"numéro masqué"};

 if(s==="demarree"){M.changerStatut(q,"picked_up",D.p.nom,"Collecte confirmée (code du fournisseur)");M.changerStatut(q,"in_transit",D.p.nom)}

}catch(e){}});
const posLiv=()=>{const l=D.p&&LIVREURS.get(D.p.id);return l&&l.dossier&&l.dossier.position||null};
const offrePortail=o=>{const p=posLiv(),dk=p?km(p,o.de):null;return{id:o.id,numero:o.ref,src:"portail",real:true,tab:o.mode==="cargo"?"cargo":"livraison",k:o.mode==="cargo"?"van":"moto",cat:o.catNom,de:{n:o.de.n,z:o.de.z,la:o.de.la,lo:o.de.lo},a:{n:o.a.n,z:o.a.z,la:o.a.la,lo:o.a.lo},prix:o.devis.total,pay:"compte",payLib:"Compte professionnel",km:o.km,du:o.du,ap:dk==null?3+hash(o.id)%6:Math.max(2,Math.round(dk*1.35/(o.mode==="cargo"?20:30)*60)),dk:dk==null?null:Math.round(dk*10)/10,poids:+(o.colis&&o.colis.poids)||0,code:o.codeCollecte,codeLivraison:o.codeLivraison,liv:true,colis:{n:o.dest.nom,t:o.dest.tel,c:o.colis.c,cod:o.cod||0,payeur:o.payeurTransport==="dest"?"dest":"exp",vit:o.vitesseNom},org:{id:o.org,nom:o.orgNom}}};
const match=o=>D.p&&TYPES[D.p.type].tabs.includes(o.tab);
function offreSim(){const tabs=TYPES[D.p.type].tabs,tab=tabs[Math.floor(Math.random()*tabs.length)],L=LIEUX.filter(l=>l.n!=="Ma position (démo)"),a=L[Math.floor(Math.random()*L.length)];let b;do{b=L[Math.floor(Math.random()*L.length)]}while(b===a);
 const d=Math.max(.8,km(a,b)*1.35),t=TAR[tab],liv=!!t[3],prix=M.devis(PLAN,{cat:t[0],km:d}).total,pay=["cash","cash","wave","orange"][Math.floor(Math.random()*4)],avecCod=liv&&tab==="livraison"&&Math.random()<.4;
 return{id:"s"+Date.now(),real:false,tab,k:t[2],cat:t[1],de:a,a:b,prix,pay,payLib:PAYL[pay],km:+d.toFixed(1),du:Math.max(4,Math.round(d/(tab==="cargo"?20:30)*60)+3),ap:2+Math.floor(Math.random()*7),code:String(1000+Math.floor(Math.random()*9000)),liv,colis:liv?{n:"Awa K.",t:"0707070707",c:avecCod?"Vêtements":"Documents",cod:avecCod?15000:0,payeur:"exp",vit:"Standard"}:null}}
/* Rendu */
const bar=()=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="logo" style="font-size:20px"><i>11</i>Barré <small style="font-size:12px;font-weight:800;color:var(--mu)">Pro</small></span><span class="st ${D.ligne?"on":""}" role="status">${D.ligne?"● En ligne":"Hors ligne"}</span></div>`;
function loginV(){const f=D.f;return`<div class="page"><span class="logo"><i>11</i>Barré <small style="font-size:14px;font-weight:800;color:var(--mu)">Pro</small></span><h1 style="font-size:26px;margin:18px 0 4px">Gagnez de l'argent avec 11Barré</h1><p class="nt">Chauffeur ou livreur : recevez des demandes, suivez vos gains.</p>
<div class="sec">Je suis</div>${Object.entries(TYPES).map(([k,t])=>`<button class="opt ${f.type===k?"on":""}" data-a="type" data-t="${k}"><span class="dot"></span><span class="t"><b>${t.nom}</b><small>${t.d}</small></span></button>`).join("")}
<label class="l">Nom et prénom<input class="fld" data-k="nom" value="${esc(f.nom)}" maxlength="40" autocomplete="off"></label><label class="l">Téléphone<input class="fld" data-k="tel" inputmode="tel" value="${esc(f.tel)}" maxlength="20" autocomplete="off"></label>
<div class="eb">Maquette : aucune vérification d'identité. La version réelle demandera pièce d'identité, permis et papiers du véhicule.</div>
<div class="cta"><button class="btn" data-a="entrer">Continuer</button></div><p class="nt" style="text-align:center"><a href="index.html" style="color:inherit">Espace client</a></p></div>`}
function carte(){const el=$("#map");if(!el)return;W=el.clientWidth||360;H=el.clientHeight||300;const c=D.course;
 if(!c){el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${fond()}<circle cx="${W/2}" cy="${H/2}" r="22" fill="#ffc21a" opacity=".35"/><circle cx="${W/2}" cy="${H/2}" r="9" fill="#0d1b2a" stroke="#fff" stroke-width="3"/></svg>`;return}
 const p=proj(c.de,c.a),A=p(c.de),B=p(c.a),pts=[A,[B[0],A[1]],B],route=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" "),f=avance();let m;
 if(c.step==="approche")m=along([[A[0]-70,A[1]-55],[A[0]-70,A[1]],A],f);else if(c.step==="cours"||c.step==="fin")m=along(pts,c.step==="fin"?1:f);else m={x:A[0],y:A[1],ang:0};
 const car=`<g transform="translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${(m.ang+90).toFixed(0)})"><rect x="-8" y="-14" width="16" height="28" rx="6" fill="#0d1b2a" stroke="#fff" stroke-width="2"/><rect x="-5" y="-6" width="10" height="7" rx="2" fill="#ffc21a"/></g>`;
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Itinéraire de ${esc(c.de.n)} à ${esc(c.a.n)}">${fond()}<path d="${route}" stroke="#fff" stroke-width="11" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${route}" stroke="var(--route)" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${A[0]}" cy="${A[1]}" r="9" fill="#fff" stroke="#0d1b2a" stroke-width="4"/><circle cx="${B[0]}" cy="${B[1]}" r="9" fill="#fff" stroke="#ff5a36" stroke-width="4"/>${car}</svg>`}
const avance=()=>{const c=D.course;if(!c)return 0;const n=Date.now();return c.step==="approche"?Math.min(.95,(n-c.ta)/30000):c.step==="cours"?Math.min(.95,(n-c.tc)/40000):1};
const jour=()=>D.hist.filter(h=>h.d===AUJ());
const sjour=l=>({n:l.length,net:l.reduce((t,h)=>t+h.net,0),comm:l.reduce((t,h)=>t+h.prix-h.net,0)});
/* Argent : tout vient du journal immuable partagé (moteur.js) ; rien n'est écrasé, les soldes se déduisent des écritures */
const ledger=()=>M.chargerLivre(LS.get("ledger",null)),sauve=L=>LS.set("ledger",{tx:L.tx});
const pos=()=>M.soldeLivreur(ledger(),D.p.id),solde=()=>pos().solde;
const mesVers=()=>D.p?VERS.liste().filter(v=>v.livreur===D.p.id&&v.statut==="attente"):[],enAttente=()=>mesVers().reduce((t,v)=>t+v.m,0);
if(D.p&&!D.p.id){D.p.id="L"+hash(D.p.nom).toString(36);LS.set("profil",D.p)}
/* Dossier du livreur : validé par l'administration avant toute mise en ligne ; assurance non expirée exigée */
const assurerLivreur=()=>{if(D.p&&D.p.id&&!LIVREURS.get(D.p.id))LIVREURS.ajouter({id:D.p.id,nom:D.p.nom,tel:D.p.tel,type:D.p.type,statut:"en_verification",dossier:null,cree_le:Date.now()})};
assurerLivreur();
const dossierCarte=()=>{const l=LIVREURS.get(D.p.id)||{statut:"en_verification"},st=l.statut;
 if(st==="valide")return M.docsValides(l)?"":`<div class="eb ko">Votre assurance est expirée : mettez votre dossier à jour pour continuer.</div><div class="go"><button class="btn sec2" style="font-size:15px;padding:12px" data-a="dossier">Mettre à jour mon dossier</button></div>`;
 const msg={en_verification:l.dossier?"Votre dossier est en cours de vérification par 11Barré.":"Complétez votre dossier pour pouvoir passer en ligne.",complement:"11Barré demande un complément : "+(l.motif||""),refuse:"Dossier refusé : "+(l.motif||""),suspendu:"Compte suspendu : "+(l.motif||"")}[st]||"";
 return`<div class="eb">${esc(msg)}</div>${st!=="suspendu"&&st!=="refuse"?`<div class="go"><button class="btn sec2" style="font-size:15px;padding:12px" data-a="dossier">${l.dossier?"Modifier mon dossier":"Compléter mon dossier"}</button></div>`:""}`};
function accueilV(){const j=sjour(jour());let s;

 <div class="kpi k3"><div><b>${j.n}</b><span>courses</span></div><div><b>${F(j.net)}</b><span>gain net</span></div><div><b>4,9 ★</b><span>note</span></div></div>
 <div class="go"><button class="btn ${D.ligne?"sec2":""}" data-a="ligne">${D.ligne?"Passer hors ligne":"Passer en ligne"}</button></div>${D.ligne?`<div class="go"><button class="btn sec2" data-a="simuler" style="font-size:15px;padding:12px">Simuler une demande (démo)</button></div>`:""}</div>`;
 return`<div class="col"><div id="map"></div>${D.course?`<button class="sos" data-a="sos" aria-label="SOS" style="top:max(14px,env(safe-area-inset-top))">SOS</button>`:`<div class="tt" style="right:14px;left:14px">${bar()}</div>`}${s}</div>`}
/* Preuves photo : réduites dans le navigateur (≤ 640 px, JPEG ≈ 0,6, ≤ 120 Ko) puis rangées dans order.preuves */
const PHOTO_MAX_O=120*1024,photoReq=()=>!!(PLAN.options&&PLAN.options.preuve_photo_livraison);
const preuve=(c,type)=>{const q=LIV.lire().find(x=>x.id===c.id);return q&&(q.preuves||[]).find(p=>p.type===type)||null};
const photoBloc=(c,type,oblig)=>{const p=preuve(c,type),lib=type==="collecte"?"collecte":"remise du colis";return`<div class="eb ph"><b>Photo de ${lib}</b> <span class="hint">${oblig?"obligatoire":"facultative"}</span>${p?`<img src="${p.photo}" alt="Photo de ${lib} enregistrée">`:""}<div class="go"><button class="btn sec2" style="font-size:15px;padding:12px" data-a="photo" data-t="${type}">${p?"Reprendre la photo":"Prendre une photo"}</button></div></div>`};
const remOk=()=>{const c=D.course;return !!c&&(c.src!=="portail"||(D.f.code2===c.codeLivraison&&(!photoReq()||!!preuve(c,"livraison"))))};
function reduirePhoto(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error("illisible"))};im.onload=()=>{URL.revokeObjectURL(u);
 const T=[[640,.6],[560,.5],[480,.45],[400,.4],[320,.35],[256,.3]];
 for(const[mx,q]of T){const r=Math.min(1,mx/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height)),w=Math.max(1,Math.round((im.naturalWidth||im.width)*r)),h=Math.max(1,Math.round((im.naturalHeight||im.height)*r)),cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
  const url=cv.toDataURL("image/jpeg",q);if((url.length-url.indexOf(",")-1)*3/4<=PHOTO_MAX_O)return ok(url)}ok(null)};im.src=u})}
function enregistrerPreuve(id,type,photo){const l=LIV.lire(),o=l.find(x=>x.id===id);if(!o)return"Commande introuvable";

function courseV(){const c=D.course,liv=c.liv,mot=liv?"livraison":"course",f=avance(),eta=c.step==="approche"?Math.max(1,Math.ceil(c.ap*(1-f))):Math.max(1,Math.ceil(c.du*(1-f)));

 const ent={approche:`${c.src==="portail"?"Rejoindre le point de collecte":"Rejoindre le client"} · ≈ ${eta} min`,arrive:"Vous êtes arrivé",cours:`En route · ≈ ${eta} min`,fin:"Terminé : encaissement"}[c.step];

/** Présence : horodatage en_ligne_a par livreur (0 = hors ligne). Écrit au plus toutes les 2 s. */

function repartiteur(now){const livs=LIVREURS.liste(),liste=LIV.lire();let ch=false;
 liste.forEach(c=>{if(c.statut!=="ready_for_assignment"&&!c.offre_courante&&!c.sans_candidat)return;if(M.repartir(c,livs,{plan:PLAN,now,commandes:liste}).changed)ch=true});
 if(ch)LIV.ecrire(liste)}
const ACTIVES=["assigned","courier_to_pickup","picked_up","in_transit"];
/* Boucle : présence, répartiteur, demandes de l'application client, compte à rebours, position simulée */
setInterval(()=>{if(!D.p)return;const now=Date.now();
 if(D.ligne)LS.set("chauffeur_ligne",now);

 {const f=document.activeElement;   /* l'administration a agi : on rafraîchit sans toucher à une saisie en cours */

 if(D.offre&&D.offre.real&&!D.offre.src&&(!c||c.id!==D.offre.id||c.statut!=="recherche")){D.offre=null;D.sheet=null;render();toast("Le client a annulé la demande")}
 if(D.course&&D.course.real&&!D.course.src&&(!c||c.id!==D.course.id||c.statut==="annulee_client")&&D.course.step!=="fin"){D.course=null;D.sheet=null;render();toast("Le client a annulé la course")}
 if(!D.course&&!D.offre){const q=LIV.lire().find(x=>x.chauffeur&&x.chauffeur.id===D.p.id&&(ACTIVES.includes(x.statut)||(x.statut==="delivered"&&!x.cloture)));   /* affectation par les opérations, ou reprise après rechargement (même en fin de course : encaissement à enregistrer) */

   if(!D.ligne&&!fin){D.ligne=true;LS.set("ch_ligne_"+D.p.id,true);battement(now,true)}render();toast(fin?"Course terminée : enregistrez l'encaissement":"Course en cours reprise")}}
 if(D.ligne&&!D.offre&&!D.course){const q=LIV.lire().find(x=>x.statut==="ready_for_assignment"&&x.offre_courante&&x.offre_courante.livreur===D.p.id);   /* le livreur ne voit que les offres qui lui sont adressées */
  if(q){D.offre=Object.assign(offrePortail(q),{t0:q.offre_courante.at});render()}}
 if(D.offre&&D.offre.src==="portail"){const q=LIV.lire().find(x=>x.id===D.offre.id);if(!q||q.statut!=="ready_for_assignment"||!q.offre_courante||q.offre_courante.livreur!==D.p.id||q.offre_courante.at!==D.offre.t0){const exp=now-D.offre.t0>=DELAI*1000;D.offre=null;D.sheet=null;render();toast(exp?"Demande expirée : elle est passée à un autre livreur":"Cette demande n'est plus disponible")}}
