<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="11Barré : commandez une course, une moto ou une livraison en Côte d'Ivoire. Prix et délai affichés avant de commander (maquette de démonstration).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="11Barré">
<title>11Barré — Courses et livraison</title>
<link rel="stylesheet" href="commun.css">
 <link rel="stylesheet" href="modern-ui.css">
  <link rel="stylesheet" href="premium-ui.css">
</head>
<body class="client">
<div id="app"></div>
<div id="sr" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript><p style="padding:20px">11Barré a besoin de JavaScript pour fonctionner.</p></noscript>
<script src="commun.js"></script>
<script src="moteur.js"></script>
<script>
"use strict";
/* 11Barré — maquette interactive du parcours client (courses et livraison).
   Données de démonstration : aucun serveur, aucun paiement réel, chauffeurs et livreurs fictifs, positions approximatives.
   Gardés sur l'appareil : historique avec reçus, adresses récentes, mode de paiement, dernier lieu, course en cours (reprise après rechargement). */
const SERV={
 courses:{nom:"Courses",v:30,items:[{id:"eco",nom:"Éco",pl:4,note:"Véhicules climatisés",k:"car"},{id:"confort",nom:"Confort",pl:4,note:"Climatisés, 2007 ou plus récent",k:"car"},{id:"plus",nom:"Confort+",ind:true,k:"car"},{id:"fam",nom:"Famille",pl:6,note:"Monospace, 6 places",k:"van"}]},
 moto:{nom:"Moto-taxi",v:34,items:[{id:"mt",nom:"Moto-taxi",pl:1,note:"Un passager, casque fourni",k:"moto"}]},
 livraison:{nom:"Livraison",v:30,liv:true,items:[{id:"lm",nom:"Livraison à moto",note:"Colis jusqu'à 10 kg",k:"moto"},{id:"cod",nom:"Paiement à la livraison",cod:true,note:"Le livreur encaisse pour vous",k:"moto"}]},
 cargo:{nom:"Cargo",v:22,liv:true,items:[{id:"ex",nom:"Express Cargo",note:"Camionnette, 500 kg",k:"van"},{id:"ca",nom:"Camion",note:"Gros volume, aide au chargement",k:"truck"}]}};
const VIT=[{id:"exp",n:"Express",d:"Direct, sans autre colis"},{id:"std",n:"Standard",d:""},{id:"grp",n:"Un peu plus long",d:"Le coursier peut livrer un autre colis sur la route"},{id:"diff",n:"Dans 2 heures",d:"Récupération et livraison d'ici "}];
const PAIE=[["cash","Espèces","Payer au chauffeur ou au livreur"],["orange","Orange Money","Paiement par numéro de téléphone ou code QR"],["wave","Wave","Paiement par numéro de téléphone ou code QR"],["mtn","MTN MoMo","Paiement par numéro de téléphone"],["carte","Carte bancaire","Bientôt disponible",1]];
const DRV=[["Koffi A.","Toyota Yaris","1234 GH 01",4.9],["Awa T.","Hyundai Accent","5821 HD 01",4.8],["Yao M.","Suzuki Dzire","7709 JC 01",4.7],["Mariam S.","Kia Picanto","3302 KB 01",5.0]];
const ICON={car:'<svg viewBox="0 0 64 40"><path d="M6 28v-6l6-10c1-2 3-3 5-3h22c2 0 4 1 5 3l7 10v6z" fill="#dfe6ee"/><path d="M13 22l5-8h12v8zM33 14h8l5 8H33z" fill="#6b8299"/><circle cx="17" cy="29" r="5" fill="#0d1b2a"/><circle cx="48" cy="29" r="5" fill="#0d1b2a"/></svg>',van:'<svg viewBox="0 0 64 40"><path d="M4 28V10c0-2 1-3 3-3h30c2 0 3 1 4 3l6 8c1 1 1 2 1 3v7z" fill="#dfe6ee"/><path d="M37 11h4l5 8H37z" fill="#6b8299"/><circle cx="17" cy="29" r="5" fill="#0d1b2a"/><circle cx="46" cy="29" r="5" fill="#0d1b2a"/></svg>',moto:'<svg viewBox="0 0 64 40"><circle cx="14" cy="29" r="7" fill="#0d1b2a"/><circle cx="50" cy="29" r="7" fill="#0d1b2a"/><path d="M14 29l10-12h14l12 12M24 17l-3-6h-5M38 17l-3-8h-6" stroke="#ffc21a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="12" width="12" height="10" rx="2" fill="#c98a00"/></svg>',truck:'<svg viewBox="0 0 64 40"><rect x="3" y="7" width="34" height="21" rx="2" fill="#dfe6ee"/><path d="M37 13h12l8 8v7H37z" fill="#ffc21a"/><circle cx="15" cy="30" r="5" fill="#0d1b2a"/><circle cx="46" cy="30" r="5" fill="#0d1b2a"/></svg>'};
const SVG={pin:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z" fill="currentColor"/></svg>',flag:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3v18M5 4h13l-3 4 3 4H5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7M8 12h13" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',search:'<svg viewBox="0 0 24 24" width="24" height="24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.4" fill="none"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',opts:'<svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="8" r="2.500" stroke="currentColor" stroke-width="2.200" fill="none"/><circle cx="8" cy="16" r="2.500" stroke="currentColor" stroke-width="2.200" fill="none"/></svg>',cash:'<svg viewBox="0 0 24 24" width="28" height="28"><rect x="2" y="6" width="20" height="12" rx="2" fill="#2fa84f"/><circle cx="12" cy="12" r="3" fill="#b9f0c4"/></svg>'};
const tileIco={courses:ICON.car,moto:ICON.moto,livraison:'<svg viewBox="0 0 64 64"><rect x="8" y="22" width="30" height="28" rx="3" fill="#c98a00"/><path d="M23 26v14M17 33l6-7 6 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="46" r="8" fill="#0d1b2a"/><path d="M40 40l8-10h8" stroke="#ffc21a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>',cargo:ICON.truck};
/* Icônes décoratives : masquées pour les lecteurs d'écran */
const hid=s=>s.includes("aria-hidden")?s:s.replace("<svg ",'<svg aria-hidden="true" focusable="false" ');
[SVG,ICON,tileIco].forEach(o=>Object.keys(o).forEach(k=>{o[k]=hid(o[k])}));
SVG.loc=hid('<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>');
/* État */
const AUJ=()=>new Date().toLocaleDateString("fr-FR"),ATTENTE_REELLE=20000;
const drvOnline=()=>(Date.now()-LS.get("chauffeur_ligne",0))<10000;
const O0=()=>({vit:"std",porte:false,instr:"",autreN:"",autreT:"",msg:false,dN:"",dT:"",colis:"",payeur:"exp",cod:""});
const S={ph:"home",tab:"courses",from:(()=>{const p=LS.get("pos",null);return p&&typeof p==="object"&&Number.isFinite(p.la)&&Number.isFinite(p.lo)?p:(lieu(p)||lieu("Ma position (démo)"))})(),gps:(()=>{const p=LS.get("pos",null);return !!(p&&typeof p==="object"&&Number.isFinite(p.la)&&Number.isFinite(p.lo))||!!lieu(p)})(),to:null,cat:null,pay:LS.get("pay","cash"),pick:null,sheet:null,q:"",
  o:O0(),run:null,star:0,tip:0,tags:[],hist:LS.get("hist",[]),rec:LS.get("rec",["Plateau","Cocody Deux-Plateaux","Marcory Zone 4"]),
  wel:LS.get("accueil_vu",false)?-1:0,confirm:null,recu:null,prev:null,err:"",busy:false,loc:"",opener:null};
const dist=()=>S.from&&S.to?Math.max(.8,km(S.from,S.to)*1.35):0;
const vit=()=>VIT.find(v=>v.id===S.o.vit);
const catsDe=t=>SERV[t].items,catCur=()=>SERV[S.tab].items.find(c=>c.id===S.cat);
const PLAN=LS.get("plan",null)||M.PLAN_DEFAUT; /* plan tarifaire : paramètre, jamais valeurs codées ici */
const devisC=c=>M.devis(PLAN,{cat:c.id,km:dist(),vitesse:SERV[S.tab].liv?S.o.vit:"std",porte:!!(SERV[S.tab].liv&&S.o.porte)});
const prixBase=c=>c.ind?0:M.devis(PLAN,{cat:c.id,km:dist()}).total;
const approche=c=>2+hash((S.from?S.from.n:"")+c.id)%8;
const duree=()=>Math.max(4,Math.round(dist()/SERV[S.tab].v*60)+3);
const total=c=>c?devisC(c).total:0;
function carte(){const el=$("#map");if(!el)return;W=el.clientWidth||360;H=el.clientHeight||300;const a=S.from,b=S.to;if(!a||!b){el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${fond()}</svg>`;return}
 const p=proj(a,b),A=p(a),B=p(b),M=[B[0],A[1]],pts=[A,M,B],route=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
 const r=S.run,eta=r&&r.step!=="search"?r.eta:null;let car="",bubble="",mover=null;
 if(r){const dS=[[A[0]-70,A[1]-55],[A[0]-70,A[1]],A];if(r.step==="approach")mover=along(dS,r.f);else if(r.step==="arrived")mover={x:A[0],y:A[1],ang:0};else if(r.step==="ride")mover=along(pts,r.f)}
 if(mover)car=`<g transform="translate(${mover.x.toFixed(1)} ${mover.y.toFixed(1)}) rotate(${(mover.ang+90).toFixed(0)})"><rect x="-8" y="-14" width="16" height="28" rx="6" fill="#0d1b2a" stroke="#fff" stroke-width="2"/><rect x="-5" y="-6" width="10" height="7" rx="2" fill="#ffc21a"/></g>`;
 const lab=r&&r.step==="ride"?"arrivée "+hh(Math.max(0,r.etaLeft)):(r&&r.step==="approach"?r.etaLeft+" min":(S.ph==="trip"?"arrivée "+hh(duree()+approche(catCur()||{id:"x"})):""));
 if(lab){const AN=r&&r.step==="approach"?A:B;bubble=`<g transform="translate(${Math.min(Math.max(AN[0],64),W-64)} ${Math.max(AN[1]-34,22)})"><rect x="-56" y="-18" width="112" height="30" rx="15" fill="${r&&r.step==="approach"?"#ff5a36":"#0d1b2a"}"/><text y="3" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="system-ui">${esc(lab)}</text></g>`}
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Itinéraire de ${esc(a.n)} à ${esc(b.n)}">${fond()}<path d="${route}" stroke="#fff" stroke-width="11" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${route}" pathLength="100" stroke="var(--route)" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${route}" pathLength="100" stroke="#f5a300" stroke-width="6" fill="none" stroke-dasharray="0 52 16 40"/><circle cx="${A[0]}" cy="${A[1]}" r="9" fill="#fff" stroke="#0d1b2a" stroke-width="4"/><circle cx="${B[0]}" cy="${B[1]}" r="9" fill="#fff" stroke="#ff5a36" stroke-width="4"/>${bubble}${car}</svg>`}
/* Rendu */
const bar=(l,rt)=>`<div class="top"><div>${l}</div>${rt||""}</div>`;
const WEL=[["Bienvenue sur 11Barré","Commandez une course en voiture ou à moto. Le prix et le délai s'affichent avant de confirmer : pas de surprise."],["Envoyez un colis","Faites livrer un colis à moto ou en camionnette. Avec le paiement à la livraison, le livreur encaisse l'argent pour vous."],["Payez comme vous voulez","Espèces, Orange Money, Wave ou MTN MoMo. C'est une démonstration : aucun paiement réel et des chauffeurs fictifs. Si aucun chauffeur n'est en ligne, une course de démonstration prend le relais (au bout de 20 secondes si un chauffeur a été prévenu)."]];
const wel=()=>{const i=S.wel,w=WEL[i];return`<section class="wel" aria-label="Bienvenue"><div class="nt">Étape ${i+1} sur ${WEL.length}</div><h2>${w[0]}</h2><p>${w[1]}</p><div class="dots" aria-hidden="true">${WEL.map((x,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div><div class="cta"><button class="btn sec2" data-a="welSkip">Passer</button><button class="btn" data-a="welNext">${i===WEL.length-1?"Commencer":"Suivant"}</button></div></section>`};
const posLib=()=>S.gps?"Position GPS · précision ±"+Math.round(S.from.accuracy||0)+" m":S.from.z+" · position de démonstration";
const locBtn=()=>`<button class="loc" data-a="loc" ${S.loc==="wait"?'disabled aria-busy="true"':""}>${S.loc==="wait"?'<span class="spin" aria-hidden="true"></span> Localisation…':SVG.loc+" Ma position"}</button>`;
const home=()=>`${bar(`<span class="logo"><i>11</i>Barré</span><div class="pos">Votre position <small>${esc(posLib())}</small></div>`,`<button class="ib" data-a="menu" aria-label="Menu" aria-haspopup="dialog">${SVG.menu}</button>`)}
<div class="home">${navigator.onLine===false?'<p class="banner" role="status">Vous êtes hors connexion : les écrans restent disponibles, mais rien n\'est envoyé.</p>':""}${S.wel>=0?wel():""}<div>${locBtn()}</div><div class="tiles">${Object.entries(SERV).map(([k,s],i)=>`<button class="tile ${i===0?"big":""}" data-a="svc" data-v="${k}">${tileIco[k]}<b>${s.nom}</b><span>${k==="courses"?"à partir de 3 min":k==="livraison"?"colis à partir de 400 F":k==="moto"?"rapide, dans les embouteillages":"camionnette et camion"}</span></button>`).join("")}
<button class="tile" disabled aria-disabled="true"><b>Food</b><span>bientôt</span></button><button class="tile" disabled aria-disabled="true"><b>Interurbain</b><span>bientôt</span></button></div>
<button class="search" data-a="dest">${SVG.search}<span style="flex:1">Où allez-vous ?</span></button>
<div class="sec" role="heading" aria-level="2">Adresses récentes</div>${S.rec.map(n=>lieu(n)).filter(Boolean).length?S.rec.map(n=>lieu(n)).filter(Boolean).map(l=>`<button class="row" data-a="rec" data-n="${esc(l.n)}"><span class="pin">${SVG.pin}</span><span class="t"><b>${esc(l.n)}</b><span>${esc(l.z)}</span></span><span class="m">${Math.max(4,Math.round(km(S.from,l)*1.35/30*60)+3)} min</span></button>`).join(""):'<p class="nt" style="padding:10px 2px">Vos dernières destinations apparaîtront ici.</p>'}
<p class="nt" style="margin-top:20px">Maquette de démonstration : chauffeurs, prix et paiements sont fictifs.</p></div>`;
const cartes=()=>SERV[S.tab].items.map(c=>`<button class="cat ${S.cat===c.id?"on":""}" data-a="cat" data-c="${c.id}" aria-pressed="${S.cat===c.id}" ${c.ind?"disabled":""} aria-label="${esc(c.nom)}${c.ind?", indisponible":", "+approche(c)+" minutes, "+F(prixBase(c))}">${ICON[c.k]}<small>${c.ind?"—":approche(c)+" min"}</small><b>${c.nom}</b><span class="p">${c.ind?"—":F(prixBase(c))}</span></button>`).join("");
const payLib=()=>(PAIE.find(p=>p[0]===S.pay)||PAIE[0])[1];
const dispoTxt=()=>drvOnline()?"Un chauffeur est en ligne : votre commande lui sera envoyée. S'il ne répond pas sous 20 secondes, une course de démonstration prendra le relais.":"Aucun chauffeur n'est en ligne pour le moment. Vous pouvez commander : une course de démonstration, avec un chauffeur fictif, démarrera aussitôt.";
const trip=()=>{const c=catCur();return`<button class="ib back" data-a="home" aria-label="Retour à l'accueil">${SVG.back}</button><div class="col"><div id="map"></div>
<div class="sheet"><div class="scroll"><button class="od" data-a="pf"><span class="ic">${SVG.pin}</span><span><small>${SERV[S.tab].liv?"Récupération":"Prise en charge"} · modifier</small><b>${esc(S.from.n)}</b></span></button>
<button class="od" data-a="pt"><span class="ic">${SVG.flag}</span><span><small>${S.to?"≈ "+duree()+" min · "+dist().toFixed(1)+" km":"Destination"}</small><b>${S.to?esc(S.to.n):"Où allez-vous ?"}</b></span></button>
<div class="tabs" role="tablist" aria-label="Type de service">${Object.entries(SERV).map(([k,s])=>`<button class="tab ${S.tab===k?"on":""}" role="tab" aria-selected="${S.tab===k}" data-a="tab" data-v="${k}">${s.nom}</button>`).join("")}</div>
${S.to?`<div class="cats">${cartes()}</div>`:`<p class="nt" style="padding:10px 2px">Choisissez une destination pour voir les prix et les délais.</p>`}</div>
${S.to&&c?`<p class="dispo" id="dispo">${dispoTxt()}</p>`:""}
<button class="pay" data-a="paie" aria-label="Mode de paiement : ${esc(payLib())}. Modifier">${S.pay==="cash"?SVG.cash:'<span class="chip">'+esc(payLib())+"</span>"}<span style="flex:1">${S.pay==="cash"?"Espèces":"Payer avec "+esc(payLib())}</span><span aria-hidden="true">›</span></button>
<div class="cta"><button class="btn" data-a="cmd" ${S.to&&c&&!S.busy?"":"disabled"} ${S.busy?'aria-busy="true"':""}>${S.busy?'<span class="spin" aria-hidden="true"></span> Envoi de la commande…':c?"Commander · "+F(total(c)):"Commander"}</button><button class="mini" data-a="det" aria-label="Options de la commande" ${c?"":"disabled"}>${SVG.opts}</button></div></div></div>`};
const picker=()=>`<div class="full" role="dialog" aria-modal="true" aria-label="Choisir une adresse" tabindex="-1"><header><button class="ib" data-a="pclose" aria-label="Fermer la recherche d'adresse">${SVG.back}</button><input type="search" id="pq" placeholder="${S.pick==="from"?"D'où partez-vous ?":"Où allez-vous ?"}" autocomplete="off" aria-label="${S.pick==="from"?"Adresse de départ":"Adresse d'arrivée"}" value="${esc(S.q)}"></header><div style="padding:0 16px">${S.pick==="from"?locBtn():""}</div><div id="pl" style="overflow:auto;padding:0 16px 20px"></div></div>`;
const plist=()=>{const q=S.q.trim().toLowerCase(),L=LIEUX.filter(l=>(S.pick==="from"||l.n!=="Ma position (démo)")&&(!q||(l.n+" "+l.z).toLowerCase().includes(q)));$("#pl").innerHTML=L.length?L.map(l=>`<button class="row" data-a="pset" data-n="${esc(l.n)}"><span class="pin">${SVG.pin}</span><span class="t"><b>${esc(l.n)}</b><span>${esc(l.z)}</span></span></button>`).join(""):`<p class="nt" style="padding:16px 4px">Aucune adresse trouvée pour « ${esc(S.q.trim())} ». Essayez un quartier (par exemple Cocody ou Yopougon). Dans la version réelle, la recherche couvrira toute la ville.</p><button class="btn sec2" data-a="pvoir" style="width:100%">Voir tous les lieux</button>`};
const ov=(h,lab,id)=>`<div class="ov" data-a="oclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(lab)}" tabindex="-1" data-stop="1"><div class="scroll">${h}</div></div></div>`;
const radio=(on,a,k,v,t,sub,pr)=>`<button class="opt ${on?"on":""}" role="radio" aria-checked="${on}" data-a="${a}" data-${k}="${v}"><span class="dot"></span><span class="t"><b>${t}</b>${sub?`<small>${sub}</small>`:""}</span>${pr?`<span class="pr">${pr}</span>`:""}</button>`;
const shPay=()=>ov(`<h2 style="margin:4px 0 8px">Modes de paiement</h2><div role="radiogroup" aria-label="Mode de paiement">${PAIE.map(p=>p[3]?`<button class="opt" disabled role="radio" aria-checked="false"><span class="dot"></span><span class="t"><b>${p[1]}</b><small>${p[2]}</small></span></button>`:radio(S.pay===p[0],"pay","p",p[0],p[1],p[2])).join("")}</div><p class="nt">Démo : aucun débit n'est effectué. Le paiement mobile réel demandera un accord avec l'opérateur.</p><div class="cta"><button class="btn" data-a="oclose2">Terminer</button></div>`,"Modes de paiement");
const shDet=()=>{const c=catCur(),l=SERV[S.tab].liv;return ov(`<h2 style="margin:4px 0 0">${esc(c.nom)}</h2><p class="nt" style="margin:0">${esc(c.note||"")}${c.pl?" · "+c.pl+" place"+(c.pl>1?"s":""):""}</p>${S.err?`<p class="errm" role="alert">${esc(S.err)}</p>`:""}
${l?`<div class="sec">Destinataire et colis</div><label class="l">Nom du destinataire<input class="fld" data-k="dN" value="${esc(S.o.dN)}" maxlength="60" autocomplete="off" ${S.err&&S.o.dN.trim().length<2?'aria-invalid="true"':""}></label><label class="l">Téléphone du destinataire<input class="fld" data-k="dT" inputmode="tel" value="${esc(S.o.dT)}" maxlength="20" autocomplete="off" placeholder="Ex. 07 00 00 00 00" ${S.err&&S.o.dT.replace(/\D/g,"").length<8?'aria-invalid="true"':""}></label><label class="l">Contenu du colis<input class="fld" data-k="colis" value="${esc(S.o.colis)}" maxlength="100" placeholder="Ex. documents, vêtements…"></label>${c.cod?`<label class="l">Montant à encaisser (F)<input class="fld" data-k="cod" inputmode="numeric" value="${esc(S.o.cod)}" maxlength="9" ${S.err&&!(+S.o.cod>0)?'aria-invalid="true"':""}></label><p class="nt">Le livreur encaisse cette somme auprès du destinataire et vous la reverse.</p>`:""}

const partager=(titre,texte)=>{const url=location.href.split("#")[0].split("?")[0];if(navigator.share)navigator.share({title:titre,text:texte,url}).catch(()=>{});else if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(texte+"\n"+url).then(()=>toast("Texte copié : vous pouvez le coller dans un message"),()=>toast("Partage indisponible sur cet appareil"));else toast("Partage indisponible sur cet appareil")};
const erreurLiv=c=>{if(S.o.dN.trim().length<2)return"Indiquez le nom du destinataire.";if(S.o.dT.replace(/\D/g,"").length<8)return"Indiquez un numéro de téléphone valide pour le destinataire (8 chiffres au moins).";if(c.cod&&!(Number.isInteger(+S.o.cod)&&+S.o.cod>0))return"Indiquez le montant que le livreur doit encaisser (en francs, sans virgule).";return""};
let bt=null;
const A={
  home(){if(S.run)return;clearTimeout(bt);S.busy=false;S.ph="home";S.to=null;S.cat=null;S.err="";S.pick=null;S.sheet=null;clearRun();render()},
  svc(t){S.tab=t.dataset.v;S.ph="trip";S.cat=null;S.to?autoCat():null;render()},
  dest(){ouvre();S.pick="to";S.q="";render()},
  rec(t){S.to=lieu(t.dataset.n);S.tab="courses";S.ph="trip";autoCat();render()},
  tab(t){S.tab=t.dataset.v;S.cat=null;autoCat();render()},
  cat(t){S.cat=t.dataset.c;render()},
  pf(){ouvre();S.pick="from";S.q="";render()},pt(){ouvre();S.pick="to";S.q="";render()},
  pclose(){S.pick=null;render()},pvoir(){S.q="";const q=$("#pq");if(q){q.value="";q.focus()}plist()},
  pset(t){const l=lieu(t.dataset.n);if(S.pick==="from"){if(S.to&&S.to.n===l.n){toast("Le départ et l'arrivée sont identiques : choisissez un autre lieu.");return}S.from=l;S.gps=false;LS.set("pos",null)}else{if(S.from.n===l.n){toast("Le départ et l'arrivée sont identiques : choisissez un autre lieu.");return}S.to=l;S.rec=[l.n].concat(S.rec.filter(x=>x!==l.n)).slice(0,5);LS.set("rec",S.rec)}S.pick=null;if(S.ph==="home")S.ph="trip";autoCat();render()},
  loc(){if(S.loc==="wait")return;const fin=(m)=>{S.loc="";S.pick=null;render();toast(m)};
    if(!navigator.geolocation)return toast("Localisation indisponible sur cet appareil : position de démonstration conservée.");
    S.loc="wait";render();
    try{navigator.geolocation.getCurrentPosition(p=>{const q={la:p.coords.latitude,lo:p.coords.longitude,accuracy:p.coords.accuracy||0,n:"Ma position actuelle",z:"Coordonnées GPS"};S.from=q;S.gps=true;LS.set("pos",q);fin("Position GPS obtenue avec une précision d’environ "+Math.round(q.accuracy)+" m.")},e=>fin(e&&e.code===1?"Localisation refusée : position de démonstration conservée.":e&&e.code===3?"Délai GPS dépassé : réessayez à ciel ouvert.":"Position introuvable : position de démonstration conservée."),{enableHighAccuracy:true,timeout:15000,maximumAge:10000})}catch(e){fin("Localisation indisponible : position de démonstration conservée.")}}},
  menu(){ouvre();S.sheet="menu";render()},hist(){S.sheet="hist";render()},paie(){ouvre();S.sheet="pay";render()},det(){ouvre();S.err="";S.sheet="det";render()},sos(){ouvre();S.sheet="sos";render()},
  welNext(){if(S.wel>=WEL.length-1)return A.welSkip();S.wel++;render()},welSkip(){S.wel=-1;LS.set("accueil_vu",true);render()},
  welAgain(){S.wel=0;LS.set("accueil_vu",false);S.sheet=null;S.ph="home";S.to=null;render();const w=$(".wel");if(w)w.scrollIntoView({block:"nearest"})},
  premiere(){S.sheet=null;S.ph="home";render()},
  pay(t){S.pay=t.dataset.p;LS.set("pay",S.pay);render()},
  vit(t){S.o.vit=t.dataset.p;render()},payeur(t){S.o.payeur=t.dataset.p;render()},
  oclose(t,e){if(e.target.closest("[data-stop]")&&!e.target.closest("[data-a]:not([data-a=oclose])"))return;A.oclose2()},
  oclose2(){S.sheet=(S.sheet==="recu"&&S.prev)?S.prev:null;S.prev=null;S.err="";render()},
  cmd(){if(S.busy||S.run)return;const c=catCur();if(!S.to||!c)return;
    if(SERV[S.tab].liv){const e=erreurLiv(c);if(e){S.err=e;S.sheet="det";render();return}}
    S.busy=true;render();bt=setTimeout(()=>{S.busy=false;if(S.ph==="trip"&&!S.run)lancer();else render()},600)},
  annul(){const r=S.run;if(!r)return;if(r.step==="search"||r.step==="end"){A.annulOk();return}
    ouvre();S.confirm={titre:"Annuler la course ?",texte:(r.step==="approach"||r.step==="arrived"?r.drv[0]+" est déjà en route vers vous. ":"")+"Dans la version réelle, des frais d'annulation pourront s'appliquer. Ici, aucun montant n'est débité.",oui:"Oui, annuler",non:"Non, continuer",act:"annulOk",danger:true};render()},
  annulOk(){S.confirm=null;const c=LS.get("commande",null);if(c&&S.run&&S.run.real)LS.set("commande",Object.assign(c,{statut:"annulee_client"}));clearInterval(tm);S.run=null;S.ph="trip";clearRun();render();toast("Commande annulée")},
  cfOui(){const a=S.confirm&&S.confirm.act;S.confirm=null;if(a&&A[a])A[a]();else render()},cfNon(){S.confirm=null;render()},
  effHist(){ouvre();S.confirm={titre:"Effacer l'historique ?",texte:"Toutes les courses et tous les reçus enregistrés sur cet appareil seront supprimés.",oui:"Oui, effacer",non:"Non, garder",act:"effHistOk",danger:true};render()},
  effHistOk(){S.hist=[];LS.set("hist",[]);S.sheet="hist";render();toast("Historique effacé")},
  star(t){S.star=+t.dataset.n;if(S.run)S.run.star=S.star;saveRun();render()},
  tag(t){const v=t.dataset.v;S.tags=S.tags.includes(v)?S.tags.filter(x=>x!==v):S.tags.concat(v);saveRun();render()},
  tip(t){S.tip=+t.dataset.v;saveRun();render()},
  recu(t){const h=S.hist[+t.dataset.i];if(!h)return;S.recu=h;S.prev="hist";S.sheet="recu";render()},
  recuRun(){const r=S.run;if(!r)return;ouvre();S.recu=histFrom(r,S.star,S.tip,S.tags);S.prev=null;S.sheet="recu";render()},
  imprimer(){window.print()},
  partRecu(){if(S.recu)partager("Reçu 11Barré",recuTexte(S.recu))},
  appel(){toast("L'appel n'est pas disponible dans la démonstration.")},
  fin(){const r=S.run;if(!r)return;S.hist.unshift(histFrom(r,S.star,S.tip,S.tags));S.hist=S.hist.slice(0,30);LS.set("hist",S.hist);LS.set("commande",null);S.star=0;S.tip=0;S.tags=[];S.o=O0();S.run=null;S.recu=null;S.sheet=null;A.home();toast("Merci pour votre avis")},
  share(){const r=S.run;if(!r)return;partager("Ma course 11Barré","Je suis en route avec 11Barré : "+r.de+" → "+r.a+". "+(SERV[r.tab].liv?"Livreur ":"Chauffeur ")+r.drv[0]+", plaque "+r.drv[2]+". Arrivée vers "+hh(Math.max(0,r.etaLeft||r.du))+". (démonstration : le lien ouvre l'application, le suivi en direct viendra avec la version connectée)")}};
function autoCat(){if(!S.to){S.cat=null;return}const it=SERV[S.tab].items.filter(c=>!c.ind);if(!it.find(c=>c.id===S.cat))S.cat=(S.tab==="courses"&&it[1]||it[0]).id}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const f=A[t.dataset.a];if(f){f(t,e);}});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){S.o[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;if(S.err){S.err=""}if(k==="porte")render();else saveDraft();return}if(e.target.id==="pq"){S.q=e.target.value;plist()}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(S.confirm)A.cfNon();else if(S.pick)A.pclose();else if(S.sheet)A.oclose2()}
  else if(e.key==="Tab"){const dl=[...document.querySelectorAll("#app .ov .sheet,#app .full")].pop();if(!dl)return;const f=[...dl.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=document.activeElement,p=f[0],d=f[f.length-1];if(!dl.contains(a)||a===dl){e.preventDefault();(e.shiftKey?d:p).focus()}else if(e.shiftKey&&a===p){e.preventDefault();d.focus()}else if(!e.shiftKey&&a===d){e.preventDefault();p.focus()}}});
window.addEventListener("online",()=>{if(S.ph==="home")render()});window.addEventListener("offline",()=>{if(S.ph==="home")render()});
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
/* Reprise après rechargement : course en cours, sinon brouillon de commande récent */
(function reprise(){const c=LS.get("course",null);
  if(c&&c.tab&&SERV[c.tab]){const cat=SERV[c.tab].items.find(x=>x.id===c.cat),cm=LS.get("commande",null);
    if(cat&&Date.now()-c.t0<6*3600*1000&&!(c.real&&(!cm||cm.id!==c.id))){const r=Object.assign({},c,{cat});delete r.fromN;delete r.toN;delete r.o;delete r.saved;
      S.tab=c.tab;S.from=lieu(c.fromN)||S.from;S.to=lieu(c.toN)||lieu(c.a);S.cat=c.cat;S.pay=c.pay||S.pay;S.o=Object.assign(O0(),c.o||{});S.run=r;S.ph="live";S.star=r.star||0;S.tip=r.tip||0;S.tags=r.tags||[];
      clearInterval(tm);tm=setInterval(tick,120);setTimeout(()=>toast("Votre course en cours a été reprise."),300);return}
    LS.set("course",null)}
  const b=LS.get("brouillon",null);
  if(b&&Date.now()-b.t<30*60000&&SERV[b.tab]&&lieu(b.to)){S.tab=b.tab;S.from=lieu(b.from)||S.from;S.to=lieu(b.to);S.o=Object.assign(O0(),b.o||{});S.ph="trip";S.cat=b.cat;autoCat()}})();
render();
