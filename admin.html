<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="icon" type="image/png" href="icons/admin-192.png">
<link rel="apple-touch-icon" href="icons/admin-apple-180.png">
<title>11Barré Administration</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#0d1b2a;--mu:#5b6677;--acc:#ffc21a;--accink:#1a1300;--ok:#138a55;--er:#c62828;--bl:#1c5fb8;--line:#e3ded2;--soft:#efeadf}
@media (prefers-color-scheme:dark){:root{--bg:#0b141f;--card:#142233;--ink:#f2f4f7;--mu:#9aa7b8;--line:#243449;--soft:#1b2c42;--ok:#3bbf86;--er:#ff7b72;--bl:#7fb2ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.logo{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:22px;letter-spacing:-.5px}
.logo i{position:relative;font-style:normal;background:var(--acc);color:var(--accink);border-radius:8px;padding:0 7px;line-height:1.25}
.logo i:after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:3px;background:var(--ink);transform:rotate(-14deg);border-radius:2px}
.logo small{font-size:12px;font-weight:800;color:var(--mu)}
header.top{background:var(--ink);color:#f2f4f7;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
header.top .logo small{color:#9aa7b8}header.top select{padding:6px 8px;border-radius:10px;border:0;background:#1b2c42;color:#f2f4f7}
nav.tabs{display:flex;gap:4px;overflow:auto;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px}
nav.tabs button{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent;position:relative}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
nav.tabs .n{background:var(--er);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mu);font-size:13px}
.kpi.own>div{border-color:var(--ok)}.kpi.tiers>div{border-color:var(--bl)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--acc);color:var(--accink)}.btn.s{background:var(--soft);color:var(--ink)}.btn.er{background:var(--er);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.5;cursor:default}
.fld{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px}.fld:focus{outline:3px solid var(--acc);outline-offset:1px}
label.l{display:block;font-weight:700;font-size:14px;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}@media (max-width:860px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scr{overflow:auto}tr.k{cursor:pointer}tr.k:hover{background:var(--soft)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--soft);white-space:nowrap}.chip.g{background:var(--ok);color:#fff}.chip.r{background:var(--er);color:#fff}.chip.w{background:var(--acc);color:var(--accink)}.chip.b{background:var(--bl);color:#fff}
.nt{color:var(--mu);font-size:13px}.eb{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}.ko{color:var(--er)}.okc{color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(5,12,22,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
.pop{background:var(--card);border-radius:18px;width:100%;max-width:680px;padding:18px;margin:auto}
.hl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.tl{list-style:none;margin:6px 0;padding:0 0 0 14px;border-left:3px solid var(--line)}.tl li{padding:3px 0}.tl small{color:var(--mu)}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:99px;z-index:50;font-size:14px;max-width:90%}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script src="commun.js"></script>
<script src="moteur.js"></script>
<script>
"use strict";
/* 11Barré Administration — maquette du portail d'administration (dossier fonctionnel §5.1, dossier technique §5 et §9).
   Remplace les validations « démo » : comptes entreprises, dossiers des livreurs, versements, reversements, règlements, factures.
   Aucune authentification réelle : on choisit un membre de l'équipe pour tester les rôles. Données locales, partagées avec les autres pages. */
const planActif=()=>LS.get("plan",null)||M.PLAN_DEFAUT;
const REGL=Coll("reglements");
const EQUIPE_DEF=[{id:"a1",nom:"Direction",role:"admin"},{id:"a2",nom:"Opérations",role:"operations"},{id:"a3",nom:"Comptabilité",role:"finance"},{id:"a4",nom:"Support",role:"support"}];
const ROLESA={admin:"Administrateur plateforme",operations:"Gestionnaire opérations",finance:"Comptable / financier",support:"Support client"};
const PERM={admin:["tableau","comptes","livreurs","commandes","finance","tarifs","incidents","audit","equipe","w_cmd","w_fin","valider"],operations:["tableau","comptes","livreurs","commandes","incidents","w_cmd","valider"],finance:["tableau","finance","w_fin"],support:["tableau","commandes","incidents"]};
const TABS=[["tableau","Tableau de bord"],["comptes","Entreprises"],["livreurs","Livreurs"],["commandes","Commandes"],["finance","Finance"],["tarifs","Tarifs et commissions"],["incidents","Incidents"],["audit","Audit"],["equipe","Équipe"]];
const SL={draft:["Brouillon","n"],quoted:["Devis","n"],awaiting_payment:["Attente de paiement","w"],ready_for_assignment:["À affecter","w"],assigned:["Affectée","b"],courier_to_pickup:["Vers la collecte","b"],picked_up:["Colis récupéré","b"],in_transit:["En transit","b"],arrived:["Arrivé","b"],delivered:["Livrée","g"],cancelled:["Annulée","r"],failed_delivery:["Échec","r"],return_required:["Retour à faire","w"],returned:["Retournée","n"]};
const STC={en_verification:["En vérification","w"],valide:["Validé","g"],complement:["Complément demandé","w"],refuse:["Refusé","r"],suspendu:["Suspendu","r"]};
const OUVERT=["ready_for_assignment","assigned","courier_to_pickup","picked_up","in_transit","arrived"];
const OPS={wave:"Wave",orange:"Orange Money",mtn:"MTN MoMo",virement:"Virement bancaire",cash:"Espèces"};
const ST={user:LS.get("adm_user","a1"),tab:"tableau",sheet:null,motif:"",q:"",filtre:"",ref:"",remise:"0",plan:null,pmotif:"",sim:{cat:"lm",km:"6",vit:"std",remise:"0",porte:false},rapp:"",rapres:null,affecte:"",nm:{nom:"",role:"operations"},fa:{q:""},reg:{m:"",ref:""}};
const equipe=()=>LS.get("equipe",null)||EQUIPE_DEF,moi=()=>equipe().find(e=>e.id===ST.user)||equipe()[0],peut=p=>(PERM[moi().role]||[]).includes(p);
const ledger=()=>M.chargerLivre(LS.get("ledger",null)),sauveL=L=>LS.set("ledger",{tx:L.tx});
const dt=t=>t?new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const chip=(s,tab)=>{const l=(tab||SL)[s]||[s,"n"];return`<span class="chip ${l[1]}">${esc(l[0])}</span>`};
const toast=m=>{document.querySelectorAll("#toast").forEach(x=>x.remove());const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const ordres=()=>LIV.lire().sort((a,b)=>b.cree_le-a.cree_le),orgNom=id=>(ORGS.get(id)||{}).nom||id;
const retard=o=>o.statut==="ready_for_assignment"&&Date.now()-((o.evenements||[]).slice(-1)[0]||{at:o.cree_le}).at>planActif().seuils.delai_affectation_min*60000;
const motifOk=()=>ST.motif.trim().length>=3?ST.motif.trim():null;
const telecharger=(nom,lignes)=>{const u=URL.createObjectURL(new Blob([lignes.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\n")],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download=nom;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
const somme=(L,pref,sens)=>{let d=0,c=0;L.tx.forEach(t=>t.lignes.forEach(l=>{if(l.compte.startsWith(pref)){d+=l.debit;c+=l.credit}}));return sens==="credit"?c-d:d-c};
/* ---------- À traiter (compteurs) ---------- */
function aTraiter(){const LG=ledger(),L=ordres(),liv=LIVREURS.liste();return{
 comptes:ORGS.liste().filter(o=>o.statut==="en_verification").length,
 livreurs:liv.filter(l=>l.statut==="en_verification"&&l.dossier).length,
 versements:VERS.liste().filter(v=>v.statut==="attente").length,
 reversements:REVERS.liste().filter(r=>r.statut==="attente").length+REGL.liste().filter(r=>r.statut==="attente").length,
 factures:(LS.get("factures",[])).filter(f=>f.statut==="emise").length,
 sansAffectation:L.filter(retard).length,
 docsExpires:liv.filter(l=>l.statut==="valide"&&!M.docsValides(l)).length,
 incidents:INCID.liste().filter(i=>i.statut!=="clos").length,
 integrite:M.equilibre(LG)}}
/* ---------- Vues ---------- */
function dashV(){const L=ordres(),aj=new Date().toDateString(),LG=ledger(),n=aTraiter(),liv=LIVREURS.liste();
 const c=f=>L.filter(f).length,aujd=c(o=>new Date(o.cree_le).toDateString()===aj);
 const al=[["comptes",n.comptes,"compte(s) entreprise à valider","comptes"],["livreurs",n.livreurs,"dossier(s) de livreur à contrôler","livreurs"],["versements",n.versements,"versement(s) de livreur à valider","finance"],["reversements",n.reversements,"reversement(s) / règlement(s) en attente d'approbation","finance"],["factures",n.factures,"facture(s) émise(s) non payée(s)","finance"],["sansAffectation",n.sansAffectation,"commande(s) sans affectation depuis plus de "+planActif().seuils.delai_affectation_min+" min","commandes"],["docsExpires",n.docsExpires,"livreur(s) validé(s) avec assurance expirée","livreurs"],["incidents",n.incidents,"incident(s) ouvert(s)","incidents"]].filter(a=>a[1]>0&&peut(a[3]));
 return`<h1>Tableau de bord</h1><div class="kpi"><div><b>${aujd}</b><span>commandes aujourd'hui</span></div><div><b>${c(o=>o.statut==="ready_for_assignment")}</b><span>à affecter</span></div><div><b>${c(o=>OUVERT.includes(o.statut)&&o.statut!=="ready_for_assignment")}</b><span>en cours</span></div><div><b>${c(o=>o.statut==="delivered")}</b><span>livrées</span></div><div><b>${c(o=>o.statut==="cancelled")}</b><span>annulées</span></div><div><b>${c(retard)}</b><span>en retard d'affectation</span></div><div><b>${c(o=>o.mode==="moto")} / ${c(o=>o.mode==="cargo")}</b><span>Moto / Cargo</span></div><div><b>${n.incidents}</b><span>incidents ouverts</span></div></div>
 <h2>Argent : fonds propres et fonds de tiers séparés</h2><p class="nt">Les sommes encaissées pour le compte des fournisseurs ne sont jamais du chiffre d'affaires de 11Barré.</p>
 <div class="kpi own"><div><b>${F(M.revenuPropre(LG))}</b><span>revenu propre de 11Barré (commissions)</span></div></div><div class="kpi tiers" style="margin-top:10px"><div><b>${F(M.fondsTiers(LG))}</b><span>fonds dus aux fournisseurs</span></div><div><b>${F(somme(LG,"dette_livreur:","credit"))}</b><span>gains dus aux livreurs</span></div></div><div class="kpi" style="margin-top:10px"><div><b>${F(somme(LG,"creance_client:","debit"))}</b><span>créances clients (transport facturé)</span></div><div><b>${F(somme(LG,"caisse","debit"))}</b><span>caisse de la plateforme</span></div><div><b>${F(somme(LG,"especes:","debit"))}</b><span>espèces détenues par les livreurs</span></div></div>
 ${n.integrite?"":'<div class="alert" style="border-left-color:var(--er)"><b>Alerte : le journal financier est déséquilibré.</b></div>'}
 <h2>À traiter</h2>${al.length?al.map(a=>`<div class="alert"><span><b>${a[1]}</b> ${esc(a[2])}</span><button class="btn s sm" data-a="tab" data-t="${a[3]}">Ouvrir</button></div>`).join(""):'<div class="card nt">Rien à traiter pour le moment.</div>'}
 <h2>Équipe de livraison</h2><div class="kpi"><div><b>${liv.filter(l=>l.statut==="valide").length}</b><span>livreurs validés</span></div><div><b>${ORGS.liste().filter(o=>o.statut==="valide").length}</b><span>entreprises actives</span></div><div><b>${Math.round(L.filter(o=>o.statut==="delivered").length/Math.max(1,L.filter(o=>["delivered","failed_delivery","cancelled"].includes(o.statut)).length)*100)} %</b><span>livraisons réussies</span></div></div>`}
function comptesV(){const L=ORGS.liste().sort((a,b)=>b.cree_le-a.cree_le),q=ST.q.toLowerCase();return`<h1>Entreprises et fournisseurs</h1><div class="card"><input class="fld" data-q="1" placeholder="Rechercher" value="${esc(ST.q)}"></div><div class="card scr"><table><tr><th>Entreprise</th><th>Type</th><th>Statut</th><th>Remise</th><th>Livraisons</th><th>Créé le</th></tr>${L.filter(o=>!q||(o.nom+o.email).toLowerCase().includes(q)).map(o=>`<tr class="k" data-a="ouvrir" data-t="org" data-id="${o.id}"><td><b>${esc(o.nom)}</b><br><span class="nt">${esc(o.email)}</span></td><td>${o.type==="entreprise"?"Entreprise cliente":"Fournisseur"}</td><td>${chip(o.statut,STC)}</td><td>${o.remise?Math.round(o.remise*100)+" %":"—"}</td><td>${LIV.lire().filter(x=>x.org===o.id).length}</td><td>${dt(o.cree_le)}</td></tr>`).join("")||'<tr><td colspan="6" class="nt">Aucune entreprise inscrite.</td></tr>'}</table></div>`}
function livreursV(){const L=LIVREURS.liste().sort((a,b)=>b.cree_le-a.cree_le),LG=ledger(),q=ST.q.toLowerCase();return`<h1>Livreurs et flotte</h1><div class="card"><input class="fld" data-q="1" placeholder="Rechercher" value="${esc(ST.q)}"></div><div class="card scr"><table><tr><th>Nom</th><th>Type</th><th>Statut</th><th>Véhicule</th><th>Assurance</th><th>Courses</th><th>Solde</th></tr>${L.filter(l=>!q||l.nom.toLowerCase().includes(q)).map(l=>{const exp=l.dossier&&l.dossier.assurance_exp,ok=M.docsValides(l),p=M.soldeLivreur(LG,l.id);return`<tr class="k" data-a="ouvrir" data-t="liv" data-id="${l.id}"><td><b>${esc(l.nom)}</b><br><span class="nt">${esc(l.tel||"")}</span></td><td>${l.type==="livreur"?"Livreur Moto":"Chauffeur / Cargo"}</td><td>${chip(l.statut,STC)}${l.statut==="en_verification"&&!l.dossier?'<br><span class="nt">dossier non envoyé</span>':""}</td><td>${esc(l.dossier?l.dossier.plaque:"—")}</td><td>${exp?(ok?esc(exp):'<span class="ko">expirée '+esc(exp)+"</span>"):"—"}</td><td>${LIV.lire().filter(o=>o.chauffeur&&o.chauffeur.id===l.id&&o.statut==="delivered").length}</td><td>${F(p.solde)}</td></tr>`}).join("")||'<tr><td colspan="7" class="nt">Aucun livreur inscrit.</td></tr>'}</table></div>`}
function cmdV(){const q=ST.q.toLowerCase(),f=ST.filtre;const L=ordres().filter(o=>(!f||(f==="cours"?OUVERT.includes(o.statut):f==="retard"?retard(o):f==="livree"?o.statut==="delivered":["cancelled","failed_delivery","returned","return_required"].includes(o.statut)))&&(!q||(o.ref+o.orgNom+o.dest.nom+o.a.n).toLowerCase().includes(q)));
 return`<h1>Commandes</h1><div class="card row"><input class="fld" style="flex:2;min-width:180px" data-q="1" placeholder="Référence, entreprise, destinataire…" value="${esc(ST.q)}"><select class="fld" style="flex:1;min-width:150px" data-filtre="1"><option value="">Tous les statuts</option><option value="cours" ${f==="cours"?"selected":""}>En cours</option><option value="retard" ${f==="retard"?"selected":""}>En retard d'affectation</option><option value="livree" ${f==="livree"?"selected":""}>Livrées</option><option value="autre" ${f==="autre"?"selected":""}>Annulées et échecs</option></select></div><div class="card scr"><table><tr><th>Référence</th><th>Entreprise</th><th>Mode</th><th>Destination</th><th>Statut</th><th>Livreur</th><th>Total</th><th>Créée</th></tr>${L.map(o=>`<tr class="k" data-a="ouvrir" data-t="cmd" data-id="${o.id}"><td><b>${esc(o.ref)}</b></td><td>${esc(o.orgNom)}</td><td>${o.mode==="moto"?"Moto":"Cargo"}</td><td>${esc(o.a.n)}</td><td>${chip(o.statut)}${retard(o)?' <span class="chip r">retard</span>':""}</td><td>${o.chauffeur?esc(o.chauffeur.nom):"—"}</td><td>${F(o.devis.total)}</td><td>${dt(o.cree_le)}</td></tr>`).join("")||'<tr><td colspan="8" class="nt">Aucune commande.</td></tr>'}</table></div>`}
function finV(){const LG=ledger(),seuil=planActif().seuils.approbation_double,liv=LIVREURS.liste(),orgs=ORGS.liste(),w=peut("w_fin");
 const vers=VERS.liste().filter(v=>v.statut==="attente"),file=REVERS.liste().filter(r=>r.statut==="attente").map(r=>({k:"rev",id:r.id,qui:orgNom(r.org),m:r.m,detail:(OPS[r.op]||r.op)+" "+r.c,approbations:r.approbations||[],at:r.at})).concat(REGL.liste().filter(r=>r.statut==="attente").map(r=>({k:"reg",id:r.id,qui:r.nom,m:r.m,detail:"Règlement livreur · réf. "+r.reference,approbations:r.approbations||[],at:r.at}))),fac=LS.get("factures",[]).filter(f=>f.statut==="emise");
 const caisse=somme(LG,"caisse","debit");
 return`<h1>Finance</h1><div class="kpi"><div><b>${F(caisse)}</b><span>caisse de la plateforme</span></div><div><b>${F(M.revenuPropre(LG))}</b><span>revenu propre</span></div><div><b>${F(M.fondsTiers(LG))}</b><span>fonds de tiers</span></div><div><b>${M.equilibre(LG)?"Équilibré":"DÉSÉQUILIBRÉ"}</b><span>contrôle du journal (${LG.tx.length} écritures)</span></div></div>
 <h2>Versements de livreurs à valider</h2><div class="card">${vers.length?vers.map(v=>{const p=M.soldeLivreur(LG,v.livreur);return`<div class="hl"><span><b>${esc(v.nom)}</b> · ${F(v.m)} · ${esc(OPS[v.mode]||v.mode)}${v.ref?" · réf. "+esc(v.ref):""}<br><span class="nt">${dt(v.at)} · espèces détenues : ${F(p.especes)} · vérifiez la réception avant de valider</span></span><span class="row"><button class="btn ok sm" data-a="validervers" data-id="${v.id}" ${w?"":"disabled"}>Valider</button><button class="btn er sm" data-a="rejetervers" data-id="${v.id}" ${w?"":"disabled"}>Rejeter</button></span></div>`}).join(""):'<p class="nt">Aucun versement en attente.</p>'}<label class="l">Motif (obligatoire pour rejeter)<input class="fld" data-m="1" value="${esc(ST.motif)}" maxlength="120"></label></div>

 $("#app").innerHTML=`<header class="top"><span class="logo"><i>11</i>Barré <small>Administration</small></span><label>Connecté en tant que <select data-user="1">${equipe().map(e=>`<option value="${e.id}" ${u.id===e.id?"selected":""}>${esc(e.nom)} (${esc(ROLESA[e.role])})</option>`).join("")}</select></label></header><nav class="tabs">${TABS.filter(t=>peut(t[0])).map(t=>`<button class="${ST.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}">${t[1]}${nb[t[0]]?`<span class="n">${nb[t[0]]}</span>`:""}</button>`).join("")}</nav><main>${main}</main>${sheetV()}`;ST.sig=signature()}

/* ---------- Actions ---------- */
const exige=(p)=>{if(!peut(p)){toast("Votre rôle ne permet pas cette action");return false}return true};
const motifRequis=()=>{const m=motifOk();if(!m)toast("Un motif est obligatoire");return m};
const A={
 tab(t){ST.tab=t.dataset.t;ST.q="";ST.filtre="";ST.motif="";render()},
 ouvrir(t){ST.sheet={t:t.dataset.t,id:t.dataset.id};ST.motif="";ST.affecte="";const o=ST.sheet.t==="org"?ORGS.get(t.dataset.id):null;ST.remise=o?String(Math.round((o.remise||0)*100)):"0";render()},
 fermer(){ST.sheet=null;ST.motif="";render()},fermerov(t,e){if(e.target!==t)return;ST.sheet=null;ST.motif="";render()},
 /* entreprises */
 orgstatut(t){if(!exige("valider"))return;const v=t.dataset.v,o=ORGS.get(ST.sheet.id);if(["refuse","suspendu","complement"].includes(v)&&!motifRequis())return;const m=ST.motif.trim(),avant={statut:o.statut,remise:o.remise},rem=Math.max(0,Math.min(50,+ST.remise||0))/100;
  ORGS.maj(o.id,x=>{x.statut=v;x.motif=m;if(v==="valide")x.remise=rem});auditer(moi(),"compte_"+v,"entreprise",o.nom,avant,{statut:v,remise:v==="valide"?rem:o.remise},m);ST.sheet=null;ST.motif="";render();toast("Compte : "+STC[v][0].toLowerCase())},
 orgremise(){if(!exige("valider")||!motifRequis())return;const o=ORGS.get(ST.sheet.id),rem=Math.max(0,Math.min(50,+ST.remise||0))/100;ORGS.maj(o.id,x=>{x.remise=rem});auditer(moi(),"remise_contrat","entreprise",o.nom,{remise:o.remise||0},{remise:rem},ST.motif.trim());ST.sheet=null;ST.motif="";render();toast("Remise enregistrée")},
 /* livreurs */
 livstatut(t){if(!exige("valider"))return;const v=t.dataset.v,l=LIVREURS.get(ST.sheet.id);if(["refuse","suspendu","complement"].includes(v)&&!motifRequis())return;const m=ST.motif.trim();if(v==="valide"&&(!l.dossier||!M.docsValides(l)))return toast("Dossier incomplet ou assurance expirée : validation impossible");
  LIVREURS.maj(l.id,x=>{x.statut=v;x.motif=m});auditer(moi(),"livreur_"+v,"livreur",l.nom,{statut:l.statut},{statut:v},m);ST.sheet=null;ST.motif="";render();toast("Livreur : "+STC[v][0].toLowerCase())},
 /* commandes */
 affecter(){if(!exige("w_cmd")||!motifRequis())return;const o=LIV.lire().find(x=>x.id===ST.sheet.id),l=LIVREURS.get(ST.affecte);if(!l)return toast("Choisissez un livreur éligible");if(!M.eligibles([l],o).length)return toast("Ce livreur n'est pas éligible");
  const m=ST.motif.trim();LIV.maj(o.id,x=>{M.changerStatut(x,"assigned",moi().nom,"Affectation manuelle : "+m);x.chauffeur={id:l.id,nom:l.nom,veh:l.type==="livreur"?"Moto":"Berline",plaque:l.dossier.plaque,note:4.9}});auditer(moi(),"affectation_manuelle","commande",o.ref,{livreur:null},{livreur:l.nom},m);ST.motif="";render();toast("Commande affectée à "+l.nom)},
 reaffecter(){if(!exige("w_cmd")||!motifRequis())return;const o=LIV.lire().find(x=>x.id===ST.sheet.id),m=ST.motif.trim(),av=o.chauffeur?o.chauffeur.nom:null;LIV.maj(o.id,x=>{M.changerStatut(x,"ready_for_assignment",moi().nom,"Réaffectation : "+m);x.chauffeur=null});auditer(moi(),"reaffectation","commande",o.ref,{livreur:av},{livreur:null},m);ST.motif="";render();toast("Commande remise en recherche")},
 annulercmd(){if(!exige("w_cmd")||!motifRequis())return;const o=LIV.lire().find(x=>x.id===ST.sheet.id),m=ST.motif.trim();LIV.maj(o.id,x=>{M.changerStatut(x,"cancelled",moi().nom,"Annulée par l'administration : "+m)});auditer(moi(),"annulation","commande",o.ref,{statut:o.statut},{statut:"cancelled"},m);ST.sheet=null;ST.motif="";render();toast("Commande annulée")},
 /* finance */
 validervers(t){if(!exige("w_fin"))return;const v=VERS.get(t.dataset.id),LG=ledger();if(!v||v.statut!=="attente")return;try{M.verser(LG,{ref:v.id,livreur:v.livreur,montant:v.m,mode:v.mode,reference:v.ref});sauveL(LG);VERS.maj(v.id,x=>{x.statut="valide";x.valide_par=moi().nom});auditer(moi(),"versement_valide","versement",v.id,{statut:"attente"},{statut:"valide",montant:v.m,reference:v.ref},"");render();toast("Versement validé")}catch(e){toast(e.message)}},
 rejetervers(t){if(!exige("w_fin")||!motifRequis())return;const v=VERS.get(t.dataset.id);VERS.maj(v.id,x=>{x.statut="rejete";x.motif=ST.motif.trim()});auditer(moi(),"versement_rejete","versement",v.id,{statut:"attente"},{statut:"rejete"},ST.motif.trim());ST.motif="";render();toast("Versement rejeté")},
 approuver(t){if(!exige("w_fin"))return;const coll=t.dataset.k==="rev"?REVERS:REGL;let res,err;coll.maj(t.dataset.id,x=>{try{res=M.approuver(x,moi(),planActif().seuils.approbation_double)}catch(e){err=e}});if(err)return toast(err.message);auditer(moi(),"approbation","demande",t.dataset.id,null,{approbations:res.obtenues,requises:res.requis},"");render();toast(res.pret?"Approbations complètes : prêt à exécuter":"Approuvé : un second approbateur est requis")},
 executer(t){if(!exige("w_fin"))return;const LG=ledger();try{if(t.dataset.k==="rev"){const r=REVERS.get(t.dataset.id),c=somme(LG,"caisse","debit");if(c<r.m)return toast("Fonds pas encore remis par les livreurs : reversement impossible");M.reverserFournisseur(LG,{ref:r.id,fournisseur:r.org,montant:r.m,reference:"REV-"+r.id.slice(2).toUpperCase()+"-"+r.op});sauveL(LG);REVERS.maj(r.id,x=>{x.statut="verse";x.ref="REV-"+r.id.slice(2).toUpperCase()});auditer(moi(),"reversement_execute","fournisseur",orgNom(r.org),null,{montant:r.m,reference:"REV-"+r.id.slice(2).toUpperCase()},"")}
  else{const r=REGL.get(t.dataset.id);M.regler(LG,{ref:r.id,livreur:r.livreur,montant:r.m,reference:r.reference});sauveL(LG);REGL.maj(r.id,x=>{x.statut="verse"});auditer(moi(),"reglement_execute","livreur",r.nom,null,{montant:r.m,reference:r.reference},"")}render();toast("Opération exécutée")}catch(e){toast(e.message)}},
 refuserdem(t){if(!exige("w_fin")||!motifRequis())return;(t.dataset.k==="rev"?REVERS:REGL).maj(t.dataset.id,x=>{x.statut="refuse";x.motif=ST.motif.trim()});auditer(moi(),"demande_refusee","demande",t.dataset.id,{statut:"attente"},{statut:"refuse"},ST.motif.trim());ST.motif="";render();toast("Demande refusée")},
 payerfac(t){if(!exige("w_fin"))return;if(ST.ref.trim().length<4)return toast("Indiquez la référence du paiement reçu");const l=LS.get("factures",[]),f=l.find(x=>x.numero===t.dataset.id);if(!f||f.statut!=="emise")return;try{const LG=ledger();M.encaisserCreance(LG,{ref:f.numero,client:f.client,montant:f.total,facture:f.numero,reference:ST.ref.trim()});sauveL(LG);f.statut="payee";LS.set("factures",l);auditer(moi(),"facture_payee","facture",f.numero,{statut:"emise"},{statut:"payee",reference:ST.ref.trim()},"");ST.ref="";render();toast("Paiement enregistré")}catch(e){toast(e.message)}},
 rapprocher(){const v=Math.round(+ST.rapp);if(!isFinite(v)||ST.rapp==="")return toast("Indiquez le montant du relevé");ST.rapres=M.rapprocher(ledger(),v);if(ST.rapres.statut==="ecart")auditer(moi(),"ecart_rapprochement","caisse","journal",{journal:ST.rapres.journal},{prestataire:v,ecart:ST.rapres.ecart},"Écart signalé");render()},
 exportj(){const LG=ledger();telecharger("journal-11barre.csv",[["seq","date","ref","type","compte","debit","credit"]].concat(LG.tx.flatMap(t=>t.lignes.map(l=>[t.seq,new Date(t.at).toISOString(),t.ref,t.type,l.compte,l.debit,l.credit]))))},
 exporta(){telecharger("audit-11barre.csv",[["date","acteur","role","action","entite","ref","motif","avant","apres"]].concat(AUDIT.liste().map(a=>[new Date(a.at).toISOString(),a.acteur,a.role,a.action,a.entite,a.ref,a.motif,JSON.stringify(a.avant),JSON.stringify(a.apres)])))},
 /* tarifs */
 enregistrerplan(){if(!exige("tarifs"))return;const p=ST.plan,m=ST.pmotif.trim();if(m.length<3)return toast("Un motif est obligatoire");const e=validerPlan(p);if(e)return toast(e);
  const av=planActif(),np=JSON.parse(JSON.stringify(p));np.version=av.version+1;np.actif_depuis=new Date().toISOString().slice(0,10);np.demonstration=false;np.modifie_par=moi().nom;np.id=av.id.replace(/@.*$/,"");
  const h=LS.get("plans",[]);h.push(JSON.parse(JSON.stringify(av)));LS.set("plans",h);LS.set("plan",np);auditer(moi(),"plan_tarifaire","tarifs","v"+np.version,{version:av.version,categories:av.categories,vitesses:av.vitesses,commission:av.commission,seuils:av.seuils,options:av.options},{version:np.version,categories:np.categories,vitesses:np.vitesses,commission:np.commission,seuils:np.seuils,options:np.options},m);ST.plan=null;ST.pmotif="";render();toast("Version "+np.version+" enregistrée")},
 annulerplan(){ST.plan=null;ST.pmotif="";render()},
 /* incidents */
 prendre(t){INCID.maj(t.dataset.id,x=>{x.statut="pris";x.pris_par=moi().nom});auditer(moi(),"incident_pris","incident",t.dataset.id,{statut:"ouvert"},{statut:"pris"},"");render()},
 clore(t){if(!motifRequis())return;INCID.maj(t.dataset.id,x=>{x.statut="clos";x.resolution=ST.motif.trim()});auditer(moi(),"incident_clos","incident",t.dataset.id,{statut:"pris"},{statut:"clos"},ST.motif.trim());ST.motif="";render();toast("Incident clôturé")},
 /* équipe */
 ajouter(){if(!exige("equipe"))return;if(ST.nm.nom.trim().length<2)return toast("Nom obligatoire");const l=equipe().slice();l.push({id:"a"+Date.now().toString(36),nom:ST.nm.nom.trim(),role:ST.nm.role});LS.set("equipe",l);auditer(moi(),"membre_ajoute","equipe",ST.nm.nom.trim(),null,{role:ST.nm.role},"");ST.nm.nom="";render()},
 retirer(t){if(!exige("equipe"))return;const e=equipe().find(x=>x.id===t.dataset.id);LS.set("equipe",equipe().filter(x=>x.id!==t.dataset.id));auditer(moi(),"membre_retire","equipe",e.nom,{role:e.role},null,"");render()}};
function validerPlan(p){const pos=(v,nom)=>isFinite(+v)&&+v>=0?null:nom+" invalide";let e=null;
 Object.entries(p.categories).forEach(([k,c])=>{["base","km","min"].forEach(f=>{c[f]=+c[f];if(!e&&!Number.isInteger(c[f]))e="Catégorie "+k+" : "+f+" doit être un entier positif";if(!e&&c[f]<0)e="Catégorie "+k+" : "+f+" négatif"})});
 Object.keys(p.vitesses).forEach(k=>{p.vitesses[k]=+p.vitesses[k];if(!e&&!(p.vitesses[k]>0&&p.vitesses[k]<=5))e="Vitesse "+k+" : multiplicateur entre 0 et 5"});
 ["arrondi","validite_devis_min","plancher_vitesse"].forEach(k=>{p[k]=+p[k];if(!e&&!(p[k]>=1))e=k+" invalide"});p.options.porte_a_porte=+p.options.porte_a_porte;if(!e&&!(p.options.porte_a_porte>=0))e="Porte à porte invalide";
 Object.keys(p.seuils).forEach(k=>{p.seuils[k]=+p.seuils[k];if(!e&&!(p.seuils[k]>0))e="Seuil "+k+" invalide"});
 p.commission.valeur=+p.commission.valeur;if(!e&&p.commission.type==="pourcentage"&&!(p.commission.valeur>=0&&p.commission.valeur<=0.5))e="Commission en pourcentage : entre 0 et 0,5 (50 % maximum)";if(!e&&p.commission.type==="fixe"&&!(Number.isInteger(p.commission.valeur)&&p.commission.valeur>=0))e="Commission fixe : entier positif";
 return e}
/* Règlement d'un livreur : saisie rapide dans une fenêtre dédiée */
A.regler=function(t){if(!exige("w_fin"))return;const l=LIVREURS.get(t.dataset.id),p=M.soldeLivreur(ledger(),l.id);ST.reg={m:String(p.gains),ref:"",id:l.id};ST.sheet={t:"reg",id:l.id};render()};
function sheetReg(){const l=LIVREURS.get(ST.sheet.id),p=M.soldeLivreur(ledger(),l.id),seuil=planActif().seuils.approbation_double;return`<div class="ov" data-a="fermerov"><div class="pop" role="dialog"><h1 style="margin:0">Régler ${esc(l.nom)}</h1><p class="nt">Gains dus : <b>${F(p.gains)}</b> · espèces détenues : ${F(p.especes)}</p><label class="l">Montant à payer (F)<input class="fld" data-regm="1" inputmode="numeric" value="${esc(ST.reg.m)}"></label><label class="l">Référence du paiement (Mobile Money, virement…)<input class="fld" data-regr="1" value="${esc(ST.reg.ref)}" maxlength="40"></label><p class="nt">Au-delà de ${F(seuil)}, le règlement exige l'approbation de deux personnes distinctes.</p><div class="row" style="margin-top:10px"><button class="btn" data-a="reglerok">Payer</button><button class="btn s" data-a="fermer">Annuler</button></div></div></div>`}
A.reglerok=function(){if(!exige("w_fin"))return;const l=LIVREURS.get(ST.reg.id),m=Math.round(+ST.reg.m||0),ref=ST.reg.ref.trim(),LG=ledger(),seuil=planActif().seuils.approbation_double;if(m<=0)return toast("Indiquez le montant");if(ref.length<4)return toast("Indiquez la référence du paiement");
 if(m>M.soldeLivreur(LG,l.id).gains)return toast("Le montant dépasse ce qui est dû au livreur");
 if(m>seuil){REGL.ajouter({id:"rg"+Date.now().toString(36),livreur:l.id,nom:l.nom,m,reference:ref,statut:"attente",approbations:[],at:Date.now()});auditer(moi(),"reglement_demande","livreur",l.nom,null,{montant:m,reference:ref},"Au-delà du seuil : double approbation");ST.sheet=null;render();toast("Demande créée : double approbation requise");return}
 try{M.regler(LG,{ref:"rg"+Date.now().toString(36),livreur:l.id,montant:m,reference:ref});sauveL(LG);auditer(moi(),"reglement_execute","livreur",l.nom,null,{montant:m,reference:ref},"");ST.sheet=null;render();toast("Livreur réglé")}catch(e){toast(e.message)}};
/* ---------- Événements ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const f=A[t.dataset.a];if(f)f(t,e)});
document.addEventListener("input",e=>{const d=e.target.dataset;if(!d)return;const v=e.target.type==="checkbox"?e.target.checked:e.target.value;
 if(d.m)ST.motif=v;else if(d.pm)ST.pmotif=v;else if(d.ref)ST.ref=v;else if(d.rem)ST.remise=v;else if(d.rapp)ST.rapp=v;else if(d.nm)ST.nm[d.nm]=v;else if(d.regm)ST.reg.m=v;else if(d.regr)ST.reg.ref=v;else if(d.aff)ST.affecte=v;
 else if(d.pl){const path=d.pl.split(".");let o=ST.plan;path.slice(0,-1).forEach(k=>o=o[k]);o[path[path.length-1]]=v;if(d.pl==="commission.type"){render()}else majSim()}
 else if(d.sim){ST.sim[d.sim]=v;majSim()}
 else if(d.q){ST.q=v;render();const q=document.querySelector("[data-q]");if(q){q.focus();q.setSelectionRange(v.length,v.length)}}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(!d)return;if(d.user){ST.user=e.target.value;LS.set("adm_user",ST.user);ST.sheet=null;render()}else if(d.filtre){ST.filtre=e.target.value;render()}});
function majSim(){const el=$("#simres");if(!el||!ST.plan)return;let dv;try{dv=M.devis(ST.plan,{cat:ST.sim.cat,km:+ST.sim.km||0,vitesse:ST.sim.vit,porte:ST.sim.porte,remise:(+ST.sim.remise||0)/100})}catch(e){dv=null}el.innerHTML=simHtml(dv,ST.plan)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ST.sheet){ST.sheet=null;render()}});
/* Mise à jour automatique quand une autre page agit (sans toucher à une saisie en cours) */
setInterval(()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;if(signature()!==ST.sig)render()},1500);
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
