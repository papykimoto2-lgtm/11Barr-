<style>

@media (max-width:640px){

}

<script>
"use strict";
/* ===== KIT UX partagé (identique dans fournisseur.html et admin.html) : accessibilité, fenêtres, champs, tableaux, CSV ===== */
const fold=s=>String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");   /* recherche tolérante aux accents et à la casse */
const csvCell=c=>{let s=String(c==null?"":c);if(/^[=+\-@]/.test(s)&&!/^-?\d+([.,]\d+)?$/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
const csv=(nom,lignes)=>{const u=URL.createObjectURL(new Blob(["\ufeff"+lignes.map(r=>r.map(csvCell).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
const okImg=s=>typeof s==="string"&&s.length<8e6&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s);
/* Notifications annoncées par les lecteurs d'écran (zone aria-live créée une fois) */
const tz=document.createElement("div");tz.id="tz";tz.setAttribute("role","status");tz.setAttribute("aria-live","polite");tz.setAttribute("aria-atomic","true");document.body.appendChild(tz);
let ttim=0;const toast=m=>{tz.textContent="";const t=document.createElement("div");t.id="toast";t.textContent=m;tz.appendChild(t);clearTimeout(ttim);ttim=setTimeout(()=>t.remove(),5500)};
/* Erreurs de champs affichées sous le champ, focus sur le premier champ fautif */
let ER={};const VAL={},VALG={};
const fl=(g,k,label,v,o)=>{o=o||{};const id=g+"-"+k,e=ER[g+"."+k],at=`id="${id}" class="fld" data-${g}="${esc(k)}"${e?' aria-invalid="true"':""} aria-describedby="e-${id}${o.h?" h-"+id:""}"${o.req?' aria-required="true"':""} ${o.x||""}`;let c;
 if(o.t==="select")c=`<select ${at}>${o.opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?"selected":""}>${esc(b)}</option>`).join("")}</select>`;
 else if(o.t==="textarea")c=`<textarea ${at} rows="${o.rows||2}">${esc(v)}</textarea>`;else c=`<input ${at} value="${esc(v)}">`;
 return`<div class="fg"><label class="${o.sr?"sr":"l"}" for="${id}">${label}${o.req?' <span aria-hidden="true">*</span>':""}</label>${c}${o.h?`<div class="fh" id="h-${id}">${o.h}</div>`:""}<div class="fe" id="e-${id}" aria-live="polite">${e?esc(e):""}</div></div>`};
const fid=key=>{const i=key.indexOf(".");return key.slice(0,i)+"-"+key.slice(i+1)};
const bad=(map,msg)=>{ER=map;const ks=Object.keys(map);toast(msg||map[ks[0]]);UX.want="#"+CSS.escape(fid(ks[0]));render()};
const setErr=(el,msg)=>{const g=Object.keys(el.dataset)[0],key=g+"."+el.dataset[g],m=document.getElementById("e-"+el.id);if(msg){ER[key]=msg;el.setAttribute("aria-invalid","true")}else{delete ER[key];el.removeAttribute("aria-invalid")}if(m)m.textContent=msg||""};
document.addEventListener("input",e=>{const el=e.target;if(el.getAttribute&&el.getAttribute("aria-invalid")==="true")setErr(el,"")},true);
document.addEventListener("focusout",e=>{const el=e.target;if(!el.dataset||!el.id)return;const g=Object.keys(el.dataset)[0];if(!g)return;const f=VAL[g+"."+el.dataset[g]]||(VALG[g]?v=>VALG[g](el.dataset[g],v):null);if(f&&String(el.value||"").trim()!=="")setErr(el,f(el.value)||"")});
/* Fenêtres : piège de focus, retour du focus, Échap, arrière-plan inerte */
const UX={stack:[],depth:0,mk:"",lastSel:null,want:null,conf:null,photo:null,sheetClose(){},
 sel(el){if(!el||!el.tagName||el===document.body)return null;if(el.id)return"#"+CSS.escape(el.id);const d=el.dataset,ks=Object.keys(d);if(!ks.length)return null;return el.tagName.toLowerCase()+ks.map(k=>"[data-"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())+'="'+String(d[k]).replace(/["\\]/g,"\\$&")+'"]').join("")},
 focusable(r){return[...r.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(e=>e.getClientRects().length)}};
function paint(app,html,depth,mk){const a=document.activeElement,mine=app.contains(a)&&a!==app,sel=mine?UX.sel(a):null,ss=mine?a.selectionStart:null,se=mine?a.selectionEnd:null,sy=window.scrollY,same=mk===UX.mk,st=[...app.querySelectorAll(".ov")].map(o=>o.scrollTop);
 app.innerHTML=html;app.querySelectorAll(".pop").forEach(p=>p.setAttribute("tabindex","-1"));const ov=[...app.querySelectorAll(".ov")],top=ov[ov.length-1];
 [...app.children].forEach(c=>{c.inert=!!top&&c!==top;if(c.inert)c.setAttribute("aria-hidden","true");else c.removeAttribute("aria-hidden")});
 document.body.style.overflow=top?"hidden":"";
 const on=app.querySelector("nav.tabs .on");if(on){const n=on.parentElement;n.scrollLeft=Math.max(0,on.offsetLeft-(n.clientWidth-on.offsetWidth)/2)}
 let f=null;
 if(depth>UX.depth){for(let i=UX.depth;i<depth;i++)UX.stack.push(UX.lastSel);f="first"}
 else if(depth<UX.depth){let o=null;for(let i=depth;i<UX.depth;i++)o=UX.stack.pop();f=o||"main"}
 else if(depth&&!same)f="first";
 UX.depth=depth;UX.mk=mk;
 if(UX.want){const n=app.querySelector(UX.want);UX.want=null;if(n){n.focus();n.scrollIntoView({block:"center"});return}}
 if(f==="first"){const p=top.querySelector(".pop"),af=p.querySelector("[data-autofocus]");(af||p).focus({preventScroll:true});top.scrollTop=0;return}
 if(f){const n=f==="main"?null:app.querySelector(f);const m=n||app.querySelector("main");if(m){if(!n)m.setAttribute("tabindex","-1");m.focus({preventScroll:true})}window.scrollTo(0,sy);return}
 window.scrollTo(0,sy);if(same)ov.forEach((o,i)=>{if(st[i])o.scrollTop=st[i]});
 if(sel){const n=app.querySelector(sel);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}}
/* Confirmation avant une action irréversible */
function confirmer(c){UX.conf=c;render()}
const confV=()=>{const c=UX.conf;if(!c)return"";return`<div class="ov top cf" data-a="fermerov"><div class="pop" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-d" style="max-width:480px"><h1 id="cf-t">${esc(c.titre)}</h1><p id="cf-d">${esc(c.texte)}</p>${c.extra||""}<div class="pop-f"><button type="button" class="btn s" data-a="confirmno" data-autofocus>${esc(c.non||"Non, revenir")}</button><button type="button" class="btn ${c.danger?"er":""}" data-a="confirmok">${esc(c.ok)}</button></div></div></div>`};
/* Photos de preuve (order.preuves) en miniatures cliquables */
const PTL={collecte:"collecte",livraison:"livraison"};

  const e=erreursPlan(p),ks=Object.keys(e);if(ks.length){const mp={};ks.forEach(k=>{mp["pl."+k]=e[k]});return bad(mp)}
  const av=planActif();confirmer({titre:"Publier la version "+(av.version+1)+" ?",texte:"La nouvelle grille s'applique aux prochains devis ; la version actuelle est conservée dans l'historique. Motif : "+m,ok:"Oui, enregistrer",fn(){
   const np=normaliserPlan(p);np.version=av.version+1;np.actif_depuis=new Date().toISOString().slice(0,10);np.demonstration=false;np.modifie_par=moi().nom;np.id=av.id.replace(/@.*$/,"");
   const h=LS.get("plans",[]);h.push(JSON.parse(JSON.stringify(av)));LS.set("plans",h);LS.set("plan",np);auditer(moi(),"plan_tarifaire","tarifs","v"+np.version,{version:av.version,categories:av.categories,vitesses:av.vitesses,commission:av.commission,seuils:av.seuils,options:av.options},{version:np.version,categories:np.categories,vitesses:np.vitesses,commission:np.commission,seuils:np.seuils,options:np.options},m);ST.plan=null;ST.pmotif="";toast("Version "+np.version+" enregistrée")}})},
 annulerplan(){ST.plan=null;ST.pmotif="";render();toast("Modifications annulées")},
 /* incidents */
 prendre(t){INCID.maj(t.dataset.id,x=>{x.statut="pris";x.pris_par=moi().nom});auditer(moi(),"incident_pris","incident",t.dataset.id,{statut:"ouvert"},{statut:"pris"},"");render();toast("Incident pris en charge")},
 clore(t){if(!motifRequis())return;INCID.maj(t.dataset.id,x=>{x.statut="clos";x.resolution=ST.motif.trim()});auditer(moi(),"incident_clos","incident",t.dataset.id,{statut:"pris"},{statut:"clos"},ST.motif.trim());ST.motif="";render();toast("Incident clôturé")},
 /* équipe */
 ajouter(){if(!exige("equipe"))return;if(ST.nm.nom.trim().length<2)return bad({"nm.nom":"Indiquez le nom du membre (2 caractères minimum)"});const l=equipe().slice();l.push({id:"a"+Date.now().toString(36),nom:ST.nm.nom.trim(),role:ST.nm.role});LS.set("equipe",l);auditer(moi(),"membre_ajoute","equipe",ST.nm.nom.trim(),null,{role:ST.nm.role},"");ST.nm.nom="";render();toast("Membre ajouté")},
 retirer(t){if(!exige("equipe"))return;const e=equipe().find(x=>x.id===t.dataset.id);if(!e)return;confirmer({titre:"Retirer "+e.nom+" de l'équipe ?",texte:"Cette personne n'aura plus accès à l'administration. L'historique de ses actions reste dans l'audit.",ok:"Oui, retirer",danger:true,fn(){LS.set("equipe",equipe().filter(x=>x.id!==e.id));auditer(moi(),"membre_retire","equipe",e.nom,{role:e.role},null,"");toast("Membre retiré")}})},
 /* règlement d'un livreur : saisie rapide dans une fenêtre dédiée */
 regler(t){if(!exige("w_fin"))return;const l=LIVREURS.get(t.dataset.id),p=M.soldeLivreur(ledger(),l.id);ST.reg={m:String(p.gains),ref:"",id:l.id};ST.sheet={t:"reg",id:l.id};render()},
 reglerok(){if(!exige("w_fin"))return;const l=LIVREURS.get(ST.reg.id),m=Math.round(num(ST.reg.m)||0),ref=ST.reg.ref.trim(),LG=ledger(),seuil=planActif().seuils.approbation_double;
  if(m<=0)return bad({"regm.1":"Indiquez le montant à payer, en francs"});if(ref.length<4)return bad({"regr.1":"Indiquez la référence du paiement (4 caractères minimum)"});
  if(m>M.soldeLivreur(LG,l.id).gains)return bad({"regm.1":"Le montant dépasse ce qui est dû au livreur"});
  const dem=m>seuil;confirmer({titre:dem?"Créer la demande de règlement ?":"Payer "+l.nom+" ?",texte:dem?"Règlement de "+F(m)+" à "+l.nom+" : au-delà de "+F(seuil)+", il faudra l'approbation de deux personnes distinctes avant exécution.":"Règlement de "+F(m)+" à "+l.nom+" (réf. "+ref+"). L'écriture du journal est définitive.",ok:dem?"Créer la demande":"Oui, payer",danger:!dem,fn(){
   if(dem){REGL.ajouter({id:"rg"+Date.now().toString(36),livreur:l.id,nom:l.nom,m,reference:ref,statut:"attente",approbations:[],at:Date.now()});auditer(moi(),"reglement_demande","livreur",l.nom,null,{montant:m,reference:ref},"Au-delà du seuil : double approbation");ST.sheet=null;toast("Demande créée : double approbation requise");return}
   try{const LG2=ledger();M.regler(LG2,{ref:"rg"+Date.now().toString(36),livreur:l.id,montant:m,reference:ref});sauveL(LG2);auditer(moi(),"reglement_execute","livreur",l.nom,null,{montant:m,reference:ref},"");ST.sheet=null;toast("Livreur réglé")}catch(e){toast(e.message)}}})}},KA);
/* ---------- Événements ---------- */
document.addEventListener("input",e=>{const d=e.target.dataset;if(!d)return;const v=e.target.type==="checkbox"?e.target.checked:e.target.value;
 if(d.m)ST.motif=v;else if(d.pm)ST.pmotif=v;else if(d.ref)ST.ref=v;else if(d.rem)ST.remise=v;else if(d.rapp)ST.rapp=v;else if(d.nm)ST.nm[d.nm]=v;else if(d.regm)ST.reg.m=v;else if(d.regr)ST.reg.ref=v;else if(d.aff)ST.affecte=v;
 else if(d.pl){const path=d.pl.split(".");let o=ST.plan;path.slice(0,-1).forEach(k=>o=o[k]);o[path[path.length-1]]=v;if(d.pl==="commission.type"){render()}else majSim()}
 else if(d.plb){const path=d.plb.split(".");let o=ST.plan;path.slice(0,-1).forEach(k=>o=o[k]);o[path[path.length-1]]=v}
 else if(d.sim){ST.sim[d.sim]=v;majSim()}
 else if(d.q){ST.q=v;razPg();render()}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(!d)return;if(d.user){ST.user=e.target.value;LS.set("adm_user",ST.user);ST.sheet=null;UX.conf=null;UX.photo=null;render()}else if(d.filtre){setFlt(ST.tab,e.target.value);razPg();render()}});
function majSim(){const el=$("#simres");if(!el||!ST.plan)return;let dv;const s=ST.sim;try{dv=M.devis(normaliserPlan(ST.plan),{cat:s.cat,km:num(s.km)||0,vitesse:s.vit,porte:s.porte,remise:(num(s.remise)||0)/100})}catch(e){dv=null}el.innerHTML=simHtml(dv,ST.plan)}
/* Mise à jour automatique quand une autre page agit (sans toucher à une saisie en cours) */
setInterval(()=>{const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;if(signature()!==ST.sig)render()},1500);
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
